    // separate sx/sy because Math.round on cssW/cssH can leave their
    // ratios slightly off PF_W:PF_H — a single uniform scale would
    // sub-pixel-stretch one axis. Independent factors keep the
    // playfield exactly aligned to canvas edges. All existing render
    // code uses PF coords — no per-call changes.
    const sx = canvas.width  / PF_W;
    const sy = canvas.height / PF_H;
    ctx.setTransform(sx, 0, 0, sy, 0, 0);
  }
  window.addEventListener('resize', fitCanvas);
  window.addEventListener('orientationchange', fitCanvas);
  fitCanvas();

  // --------------------------------------------------------------------
  // Local prediction (own ship only)
  //
  // Server is still authoritative. We just *also* integrate our own
  // ship from current input each frame so it tracks the controls with
  // zero visible latency. Snapshots reconcile if we drift by more than
  // SNAP_THRESHOLD (handles disconnects, ship death, dropped inputs).
  // No rollback / no replay queue — the local sim is identical to the
  // server's, so divergence in normal play stays sub-pixel.
  function mySeatIndex() {
    return mySeat ? SEATS.indexOf(mySeat) : -1;
  }

  function reconcileLocalShip(snap) {
    const idx = mySeatIndex();
    if (idx < 0) return;
    const sp = snap.players[idx];
    if (!sp) return;
    // Local position is authoritative in v7. The only times we let the
    // server overwrite it: first-ever snapshot (initial spawn), and
    // any time the wire says we're not alive (dead, or unoccupied
    // before a fresh start). Otherwise we never touch localShip.x
    // from incoming snapshots — the user's input is the truth.
    if (localShip.x === null || !sp.alive) {
      localShip.x = sp.x;
      localShip.cooldown = 0;
    }
  }

  function localAlive() {
    const idx = mySeatIndex();
    if (idx < 0 || snapBuffer.length === 0) return false;
    const sp = snapBuffer[snapBuffer.length - 1].players[idx];
    return !!sp && !!sp.alive;
  }

  function stepLocal(now) {
    if (localShip.x === null) { prevFrameT = now; return; }
    if (prevFrameT === 0)     { prevFrameT = now; return; }
    const dt = Math.min(0.1, (now - prevFrameT) / 1000);
    prevFrameT = now;

    const dx = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    localShip.x += dx * SHIP_SPEED * dt;
    if (localShip.x < 0)              localShip.x = 0;
    if (localShip.x > PF_W - SHIP_W)  localShip.x = PF_W - SHIP_W;

    // Ghost-bullet lifecycle (v7-style):
    //  - Spawn when input.fire is held AND local cooldown is clear
    //    AND ship is currently alive. Cooldown mirrors server so a
    //    burst of held-FIRE produces one ghost per real bullet.
    //  - Advance each frame at BULLET_SPEED.
    //  - Prune when off-screen or older than GHOST_TTL_MS — by which
    //    time the server's authoritative bullet has appeared in a
    //    snapshot and taken over the visual.
    localShip.cooldown = Math.max(0, localShip.cooldown - dt);
    // Release-to-fire mirrors the engine: chargeSec accumulates while
    // holding, the shot spawns on the true→false edge. localAlive +
    // cooldown gate the spawn so a held button can't queue infinite
    // shots, and tap-tap-tap rapid-fire respects FIRE_COOLDOWN. The
    // ghost previews charged mode the moment hold ≥ threshold + the
    // latest snapshot says we have ammo.
    if (!localAlive()) {
      // Server resets chargeSec + wasFiring on respawn — mirror that
      // here so a player who died holding FIRE doesn't carry stale
      // hold-time across the death/respawn boundary and fire a
      // ghost-charged shot the server won't honour.
      localShip.holdSec = 0;
      localShip.wasFiring = false;
    } else if (input.fire) {
      localShip.holdSec += dt;
    }
    if (localShip.wasFiring && !input.fire && localShip.cooldown <= 0 && localAlive()) {
      const me = mySeat && lastState ? lastState.players[SEATS.indexOf(mySeat)] : null;
      const myAmmo = me ? (me.superAmmo | 0) : 0;
      const charged = localShip.holdSec >= CHARGE_THRESHOLD_SEC && myAmmo > 0;
      const bw = charged ? CHARGED_BULLET_W : BULLET_W;
      const bh = charged ? CHARGED_BULLET_H : BULLET_H;
      ghostBullets.push({
        x: localShip.x + SHIP_W / 2 - bw / 2,
        y: SHIP_Y - bh,
        born: now,
        charged: charged,
      });
      localShip.cooldown = FIRE_COOLDOWN;
      Arcade.Audio.play('sfx-shoot', charged ? 0.75 : 0.55);
    }
    if (!input.fire) localShip.holdSec = 0;
    localShip.wasFiring = !!input.fire;
    // Ghost bullets travel at the same speeds the engine uses so the
    // visual hand-off lines up cleanly when the authoritative snapshot
    // lands. CHARGED_BULLET_SPEED is imported from the engine to keep
    // the predictor locked to sim values; falls back to a constant if
    // a stale engine.js doesn't export it yet.
    const chargedSpeed = CHARGED_BULLET_SPEED ?? 380;
    for (const gb of ghostBullets) gb.y -= (gb.charged ? chargedSpeed : BULLET_SPEED) * dt;
    for (let i = ghostBullets.length - 1; i >= 0; i--) {
      if (now - ghostBullets[i].born > GHOST_TTL_MS || ghostBullets[i].y < -BULLET_H) {
        ghostBullets.splice(i, 1);
      }
    }
  }

  // Render at the display's refresh rate. Renders the world at
  // (latestServerT - INTERP_DELAY_MS) projected forward by wall-clock
  // time since the latest snapshot, so the render time advances
  // smoothly at exactly 1 ms per ms. Each new snapshot resets the
  // reference, washing out any clock drift.
  function findBracket(renderT) {
    // Linear scan — buffer holds ~120 entries max at 60 Hz × 2 s.
    for (let i = 0; i < snapBuffer.length - 1; i++) {
      if (snapBuffer[i].t <= renderT && snapBuffer[i + 1].t >= renderT) {
        return [snapBuffer[i], snapBuffer[i + 1]];
      }
    }
    // renderT is past the newest snapshot (snapshot gap) or before the
    // oldest (first frames after connect). Fall back to the nearest
    // single snapshot — alpha will collapse to 0.
    const newest = snapBuffer[snapBuffer.length - 1];
    if (newest && newest.t <= renderT) return [newest, newest];
    return [snapBuffer[0], snapBuffer[0]];
  }

  function renderInterpolated() {
    // Transparent clear — the navy gradient is painted by the tube's
    // CSS background underneath, so the canvas just lets it show
    // through. Painting our own gradient on the canvas at PF_H scale
    // didn't line up with the tube's CSS gradient at tube-height
    // scale, producing a visible seam at the canvas edges.
    ctx.clearRect(0, 0, PF_W, PF_H);

    if (snapBuffer.length === 0) return;

    const elapsed = performance.now() - latestLocalRecvMs;
    const renderT = latestServerT + elapsed - INTERP_DELAY_MS;
    const [a, b]  = findBracket(renderT);
    const span    = b.t - a.t;
    const alpha   = span > 0 ? Math.min(1, Math.max(0, (renderT - a.t) / span)) : 0;
    const lerp    = (pa, pb) => pa + (pb - pa) * alpha;

    // Ships — local seat uses predicted x (zero-latency feel), other
    // seats lerp between snapshots. Colour is by seat index so every
    // viewer sees the same player as the same colour. Skip drawing
    // once the latest snapshot reports dead (covers unoccupied-mask
    // + actual death). Name (if any) renders just above the ship —
    // fully visible through the countdown, fades to invisible over
    // NAME_FADE_MS once ATTACK fires, comes back once the round ends.
    const latestSnap = snapBuffer[snapBuffer.length - 1];
    const renderNowEarly = performance.now();
    let nameAlpha = 1;
    if (latestSnap.status === 'running') {
      if (nameFadeStartAt > 0) {
        nameAlpha = Math.max(0, 1 - (renderNowEarly - nameFadeStartAt) / NAME_FADE_MS);
      } else {
        // Late join — we never saw the transition. Match what
        // everyone else has been seeing (names already gone).
        nameAlpha = 0;
      }
    }
    ctx.font = '6px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    for (let i = 0; i < MAX_SEATS; i++) {
      const pa = a.players[i], pb = b.players[i];
      const live = latestSnap.players[i];
      if (!pa || !pb || !live?.alive) continue;
      const isMine = (SEATS[i] === mySeat);
      const x = isMine && localShip.x !== null
        ? localShip.x
        : lerp(pa.x, pb.x);
      paintShip(ctx, x, SHIP_Y, SHIP_W, SHIP_COLORS[i]);
      if (live.name && nameAlpha > 0) {
        ctx.globalAlpha = nameAlpha;
        ctx.fillStyle = SHIP_COLORS[i];
        ctx.fillText(live.name, x + SHIP_W / 2, SHIP_Y - 7);
        ctx.globalAlpha = 1;
      }

      // Super-shot pips + charge bar above the ship. Mirrors SP's
      // drawPlayer block (pips line, optional charge bar, halo when
      // fully charged). Skipped during the name fade-in window so
      // the lobby/countdown looks clean; only renders during play.
      // For the local player, the charge bar reads from
      // localShip.holdSec instead of the snapshot — the wire round-
      // trip (~150–300 ms RTT) would otherwise delay every "hold to
      // charge" interaction, so the bar feels broken on first press.
      // Other players' charge bars stay snapshot-driven (we don't
      // have their local input).
      if (latestSnap.status === 'running') {
        const ammo = (live.superAmmo | 0);
        const charge = isMine
          ? (input.fire ? (localShip.holdSec || 0) : 0)
          : (live.chargeSec || 0);
        const pipY = SHIP_Y - 14;
        // 3 pips, 3 PF wide each, 2 PF gap. Filled gold if armed,
        // dim outline if used — same convention as SP.
        for (let p = 0; p < SUPER_SHOT_MAX; p++) {
          const px = x + 1 + p * 5;
          if (p < ammo) {
            ctx.fillStyle = '#ffd84a';
            ctx.fillRect(px, pipY, 3, 3);
          } else {
            ctx.fillStyle = 'rgba(255, 216, 74, 0.22)';
            ctx.fillRect(px, pipY, 3, 3);
          }
        }
        // Charge progress bar under the pips while holding (only
        // when there's ammo to consume — bar wouldn't fire a super
        // otherwise so don't tease the player).
        if (charge > 0 && ammo > 0) {
          const ratio = Math.min(1, charge / CHARGE_THRESHOLD_SEC);
          ctx.fillStyle = 'rgba(255, 216, 74, 0.25)';
          ctx.fillRect(x, SHIP_Y - 7, SHIP_W, 2);
          ctx.fillStyle = '#ffd84a';
          ctx.fillRect(x, SHIP_Y - 7, SHIP_W * ratio, 2);
        }
        // Pulsing halo when fully charged + ready to release. Tiny
        // 1-PF inflation/contraction every 90 ms; subtle, just enough
        // to draw the eye to "tap fire now".
        if (charge >= CHARGE_THRESHOLD_SEC && ammo > 0) {
          const pulse = 1 + Math.floor(performance.now() / 90) % 2;
          ctx.fillStyle = 'rgba(255, 216, 74, 0.35)';
          ctx.fillRect(x - pulse, SHIP_Y - 4 - pulse,
                       SHIP_W + pulse * 2, 4 + 4 + pulse * 2);
        }
      }
    }

    // Invaders — lerp by array index (engine emits the grid in a stable
    // order; dead invaders stay in the array with a:false). The classic
    // chunky shuffle becomes a smooth slide between marches.
    // Sprite + colour come from the grid row (squid / crab / crab /
    // octopus / octopus, top → bottom). Frame index is authoritative
    // (server-driven, distance-based) — same flip cadence as SP, where
    // the pose changes with each march step. Pick the frame nearest to
    // the rendered time within the [a, b] interpolation span so pose and
    // lerped position match: first half of span = a's pose, second half
    // = b's. Without this the pose can switch at alpha≈0 while position
    // is still close to a → a tiny pose/motion mismatch. Falls back to
    // 0 if an older snapshot somehow lacks the field.
    const n = Math.min(a.invaders.length, b.invaders.length);
    const frame = ((alpha < 0.5 ? a.iFrame : b.iFrame) ?? 0) & 1;
    // SP-exact rendering: paintPixels draws each 8×8 source pixel as
    // a 1.5×1.5 PF fillRect on the canvas. fitCanvas sized the canvas
    // to display resolution × DPR, so fillRect's anti-aliased edges
    // are at sub-device-pixel level and invisible. Sprites are
    // LEFT-aligned in the 18 PF cell (not centred) for SP's uniform
    // 6 PF right-padding gap; squid (9 PF wide) gets the SP-style
    // +2 PF rightward nudge to align columns under the wider rows.
    const SPRITE_SCALE = 1.5;
    // Marked-invader swoop offset — if any invader is the marked one,
    // its render position is the grid slot PLUS the server-computed
    // swoop offset (dx/dy). Pulse colour white ↔ row palette at
    // ~12.5 Hz so it reads as "this one is special". Server flips
    // the mark to null on kill / expiry, so this branch quietly
    // turns off when there's nothing to swoop.
    const marked = latestSnap.marked || null;
    const markedFlashWhite = marked
      ? (Math.floor(performance.now() / 80) % 2 === 0)
      : false;
    // Claude easter egg — row-3 cell at column `latestSnap.claudeCol`
    // gets the Claude sprite + terracotta colour instead of the
    // usual octopus. Re-rolled per grid by the engine; client just
    // honours whatever column the snapshot specifies.
    const claudeCol = (latestSnap.claudeCol != null) ? latestSnap.claudeCol : -1;
    for (let i = 0; i < n; i++) {
      const ia = a.invaders[i], ib = b.invaders[i];
      if (!ib.a || !ia.a) continue;            // dead either side → hide
      const row = Math.floor(i / SPRITE_COLS);
      const col = i % SPRITE_COLS;
      const isMarked = marked && marked.i === i;
      const isClaude = row === CLAUDE_ROW && col === claudeCol;
      const { frames, w } = spriteForRow(row);
      const ox = row === 0 ? 2 : 0;
      const dx = isMarked ? (marked.dx || 0) : 0;
      const dy = isMarked ? (marked.dy || 0) : 0;
      const cellX = Math.round(lerp(ia.x, ib.x) + ox + dx);
      const cellY = Math.round(lerp(ia.y, ib.y) + dy);
      if (isClaude && paintClaude) {
        // Claude pulses white when marked (same flash cadence) so the
        // easter egg + the marked-invader bonus both still read.
        // Guard on paintClaude being defined — a stale sprites.js
        // mid-deploy might lack the export, in which case we fall
        // through to the normal octopus render and the easter egg
        // is silently hidden until the cache refreshes.
        const claudeColour = (isMarked && markedFlashWhite) ? '#ffffff' : (CLAUDE_COLOUR || '#d97757');
        paintClaude(ctx, cellX, cellY, SPRITE_SCALE, frame, claudeColour);
      } else {
        const colour = (isMarked && markedFlashWhite)
          ? '#ffffff'
          : (ROW_COLORS[row] || '#ffffff');
        paintPixels(ctx, cellX, cellY, frames[frame], SPRITE_SCALE, colour);
      }
    }

    // Shields — decode the packed bitmap from the snapshot once when
    // it changes, then blit each set cell as a 1×1 PF px rect. Cap is
    // SHIELD_COUNT * SHIELD_W * SHIELD_H = 1408 cells; canvas handles
    // this at 60 Hz without breaking sweat. Cyan to match SP's
    // bunker colour. Hidden until at least one snapshot decodes.
    if (latestSnap.shieldsBits && latestSnap.shieldsBits !== lastShieldsBits) {
      shieldBitmap = decodeShields(latestSnap.shieldsBits);
      lastShieldsBits = latestSnap.shieldsBits;
    }
    if (shieldBitmap) {
      ctx.fillStyle = '#7ad0e0';
      for (let s = 0; s < SHIELD_COUNT; s++) {
        const sx = SHIELD_X[s];
        const base = s * SHIELD_W * SHIELD_H;
        for (let y = 0; y < SHIELD_H; y++) {
          const wy = SHIELD_Y + y;
          const rowBase = base + y * SHIELD_W;
          for (let x = 0; x < SHIELD_W; x++) {
            if (shieldBitmap[rowBase + x]) ctx.fillRect(sx + x, wy, 1, 1);
          }
        }
      }
    }

    // Boss — chunky 40×40 sprite + a green→yellow→red HP bar above
    // it. `type` (0..BOSS_TYPE_COUNT-1) picks the sprite from the
    // BOSS_TYPES roster in sprites.js. Same 2-frame animation cadence
    // as the regular swarm (toggle every 300 ms). HP ratio drives the
    // bar fill colour for a quick-glance read.
    if (latestSnap.phase === 'boss' && latestSnap.boss) {
      const bf = Math.floor(performance.now() / 300) & 1;
      const hp = latestSnap.boss.hp;
      const hpMax = latestSnap.boss.hpMax || 1;
      const ratio = Math.max(0, Math.min(1, hp / hpMax));
      // Body colour darkens as the boss bleeds — SP's 3-step palette.
      const bandIndex = ratio > 0.66 ? 0 : ratio > 0.33 ? 1 : 2;
      // v30: boss descends — y is server-authoritative now. Fall
      // back to the old BOSS_Y constant for pre-v30 snapshots so
      // a mid-deploy client doesn't render the boss at (x, undef).
      const bossY = (latestSnap.boss.y != null) ? latestSnap.boss.y : BOSS_Y;
      paintBoss(ctx, latestSnap.boss.x, bossY, 5, bf, latestSnap.boss.type || 0, bandIndex);
      const barY = bossY - 4;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
      ctx.fillRect(latestSnap.boss.x, barY, BOSS_W, 2);
      ctx.fillStyle = ratio > 0.6 ? '#6bff8c' : ratio > 0.3 ? '#ffd84a' : '#ff6666';
      ctx.fillRect(latestSnap.boss.x, barY, BOSS_W * ratio, 2);

      // Boss minion adds — small swooping crabs that shield the boss.
      // Server-authoritative positions arrive in boss.adds; we just
      // paint them at scale 1.5 (matching grid invader scale) using
      // the CRAB sprite. Pulse the colour white ↔ pink at ~12.5 Hz
      // so they read as "flashing minion" not "tiny ordinary
      // invader". Frame toggle uses the same 300 ms cadence as the
      // grid for visual consistency.
      const adds = latestSnap.boss.adds || [];
      if (adds.length) {
        const renderNow = performance.now();
        const flash = Math.floor(renderNow / 80) % 2 === 0 ? '#ffffff' : ROW_COLORS[1];
        const addFrame = Math.floor(renderNow / 300) & 1;
        const { frames: addFrames } = spriteForRow(1);
        for (const ad of adds) {
          if (!ad.a) continue;
          paintPixels(ctx, Math.round(ad.x), Math.round(ad.y), addFrames[addFrame], 1.5, flash);
        }
      }
    }

    // UFO bonus enemy — saucer silhouette ported from SP's drawUfo.
    // Position is server-authoritative; render straight from the
    // snapshot's ufo.x at the fixed UFO_Y row above the swarm.
    if (latestSnap.ufo) {
      const ux = latestSnap.ufo.x;
      ctx.fillStyle = '#a855f7';                       // purple body
      ctx.fillRect(ux + 2,           UFO_Y + 0, UFO_W - 4, 1);
      ctx.fillRect(ux + 0,           UFO_Y + 1, UFO_W,     2);
      ctx.fillRect(ux + 2,           UFO_Y + 3, UFO_W - 4, 1);
      ctx.fillRect(ux + 4,           UFO_Y + 4, UFO_W - 8, 1);
      ctx.fillStyle = '#2dd4ff';                       // cyan undercarriage glints
      ctx.fillRect(ux + 1,           UFO_Y + 4, 2, 1);
      ctx.fillRect(ux + UFO_W - 3,   UFO_Y + 4, 2, 1);
    }

    // Bullets — drawn from the latest snapshot (server-authoritative
    // for spawn time + trajectory). Normal bullets paint gold-on-
    // white-core; charged super-shots paint fat gold + white core
    // like SP, so the punch reads at a glance. Ghost bullets layered
    // on top with the same charged/normal distinction.
    for (const bl of latestSnap.bullets) {
      if (bl.c) {
        ctx.fillStyle = '#ffd84a';
        ctx.fillRect(bl.x, bl.y, CHARGED_BULLET_W, CHARGED_BULLET_H);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(bl.x + 1, bl.y + 1, CHARGED_BULLET_W - 2, CHARGED_BULLET_H - 2);
      } else {
        ctx.fillStyle = '#ffd84a';
        ctx.fillRect(bl.x, bl.y, BULLET_W, BULLET_H);
      }
    }
    ctx.fillStyle = '#ff6666';
    for (const bl of latestSnap.invaderBullets) ctx.fillRect(bl.x, bl.y, BULLET_W, BULLET_H);
    for (const gb of ghostBullets) {
      if (gb.charged) {
        ctx.fillStyle = 'rgba(255, 216, 74, 0.7)';
        ctx.fillRect(gb.x, gb.y, CHARGED_BULLET_W, CHARGED_BULLET_H);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.fillRect(gb.x + 1, gb.y + 1, CHARGED_BULLET_W - 2, CHARGED_BULLET_H - 2);
      } else {
        ctx.fillStyle = 'rgba(255, 216, 74, 0.7)';
        ctx.fillRect(gb.x, gb.y, BULLET_W, BULLET_H);
      }
    }

    // Countdown overlay (3/2/1) + a brief ATTACK! flash on the
    // countdown → running transition. Server publishes
    // countdownEndMs; we estimate the server clock from the latest
    // snapshot's t plus wall-clock elapsed since receipt.
    const renderNow = performance.now();
    if (latestSnap.status !== lastSeenStatus) {
      if (lastSeenStatus === 'countdown' && latestSnap.status === 'running') {
        attackOverlayUntil = renderNow + 600;
        nameFadeStartAt   = renderNow;
      } else if (latestSnap.status !== 'running') {
        // Pre-game / between-rounds: names should be visible again,
        // so reset the fade clock for the next countdown→running flip.
        nameFadeStartAt = 0;
      }
      lastSeenStatus = latestSnap.status;
    }
    if (latestSnap.status === 'countdown') {
      const serverNow = latestServerT + (renderNow - latestLocalRecvMs);
      const remaining = (latestSnap.countdownEndMs - serverNow) / 1000;
      let label = '';
      if      (remaining > 2) label = '3';
      else if (remaining > 1) label = '2';
      else if (remaining > 0) label = '1';
      if (label) drawCenteredOverlay(label, '#ffd84a', 32);
    }
    if (renderNow < attackOverlayUntil) {
      const alpha = (attackOverlayUntil - renderNow) / 600;
      drawCenteredOverlay('ATTACK!', `rgba(255, 58, 161, ${alpha.toFixed(2)})`, 22);
    }

    // Stage announce overlay — "STAGE n-m" centred + fades out as
    // stageAnnounceIn drops to 0. Server keeps the timer, so all
    // clients show it in sync. Skip the overlay during the very first
    // stage (stageAnnounceIn defaults to 0 in initState) so the wave
    // doesn't get an extra "STAGE 1-1" flash before play even starts.
    if ((latestSnap.stageAnnounceIn || 0) > 0) {
      const STAGE_ANNOUNCE_TOTAL = 2;
      const t = Math.min(1, (latestSnap.stageAnnounceIn || 0) / STAGE_ANNOUNCE_TOTAL);
      // Use the same phase-aware label as the HUD column — otherwise
      // the overlay reads "STAGE 1-4" while STAGE column shows
      // "STAGE 1-BOSS" because stageNum is at its sentinel value.
      const setN = latestSnap.stageSet ?? 1;
      const numN = latestSnap.stageNum ?? 1;
      const label = 'STAGE ' + (latestSnap.phase === 'boss' ? setN + '-BOSS' : setN + '-' + numN);
      drawCenteredOverlay(label, `rgba(255, 216, 74, ${t.toFixed(2)})`, 18);
    }

    // Win cutscene — pixel Earth grows, ship orbits + plants a flag,
    // starburst, EARTH IS SAFE banner. Local clock so the animation
    // stays smooth regardless of snapshot stutter. Reset when leaving
    // cutscene so a second win restarts the animation cleanly.
    if (latestSnap.phase === 'cutscene') {
      drawCutscene();
    } else if (cutsceneStartedAt !== 0) {
      cutsceneStartedAt = 0;
    }

    // Floating score popups — server-spawned on each kill, live for
    // POPUP_LIFE_SEC (0.6 s), drift upward. Each renders centred on
    // its (x, y) with alpha = life / POPUP_LIFE_SEC. Tiny font so
    // multiple stacked popups in a combo stay readable.
    if (latestSnap.popups && latestSnap.popups.length) {
      const POPUP_TOTAL = 0.6;
      ctx.font = '5px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const p of latestSnap.popups) {
        const alpha = Math.max(0, Math.min(1, (p.l || 0) / POPUP_TOTAL));
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.c || '#ffffff';
        ctx.fillText(p.t || '', p.x, p.y);
      }
      ctx.globalAlpha = 1;
    }

    // HUD — three SP-style columns across the top of the canvas:
    // SCORE (local player only, in their seat colour) | STAGE (real
    // progression lands in Phase G) | LIVES (shared respawn pool).
    // Two-line layout (label above value) so growing digits don't
    // push the label off screen.
    if (latestSnap.status === 'running' || latestSnap.status === 'gameover') {
      ctx.font = '6px "Press Start 2P", monospace';
      ctx.textBaseline = 'top';

      // SCORE — local player only. Friends' scores were cluttering
      // the HUD; each player sees their own score in their own
      // colour. Spectators (no assigned seat) get a neutral white
      // "0000" fallback.
      const seatIdx = mySeat ? SEATS.indexOf(mySeat) : -1;
      const me = seatIdx >= 0 ? latestSnap.players[seatIdx] : null;
      const myScore = (me && me.score) || 0;
      ctx.textAlign = 'left';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('SCORE', 6, 4);
      ctx.fillStyle = seatIdx >= 0 ? SHIP_COLORS[seatIdx] : '#ffffff';
      ctx.fillText(String(myScore).padStart(4, '0'), 6, 12);
      // Combo multiplier badge next to the score — only shown when
      // the chain is at ×2 or higher (×1 = "no combo", don't add
      // noise). Gold so it reads as a positive bonus indicator.
      if (me && me.combo > 0) {
        const mult = comboMultiplier(me.combo);
        if (mult > 1) {
          ctx.fillStyle = '#ffd84a';
          ctx.fillText('x' + mult, 6 + 26, 12);
        }
      }

      // STAGE — centred. Placeholder "1-1" until Phase G.
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('STAGE', PF_W / 2, 4);
      ctx.fillStyle = '#ffd84a';
      const stageSet = latestSnap.stageSet ?? 1;
      const stageNum = latestSnap.stageNum ?? 1;
      const stageLabel =
        latestSnap.phase === 'cutscene' ? 'WIN!' :
        latestSnap.phase === 'boss'     ? stageSet + '-BOSS' :
                                          stageSet + '-' + stageNum;
      ctx.fillText(stageLabel, PF_W / 2, 12);

      // LIVES — shared respawn-pool counter, right-aligned. "—" if
      // an older snapshot omits the field. The value flashes brighter
      // (yellow→white) and a floating "-1" rises and fades for
      // LIVES_FLASH_MS after the pool decrements, so the whole team
      // sees the loss instead of having to spot a quiet tick.
      ctx.textAlign = 'right';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('LIVES', PF_W - 6, 4);
      const lives = (latestSnap.lives != null) ? String(latestSnap.lives) : '—';
      const flashFor = Math.max(0, livesFlashUntil - performance.now());
      if (flashFor > 0) {
        // t: 1 at flash start, 0 at end. Brighten yellow towards white
        // by lifting green + blue channels.
        const t = flashFor / LIVES_FLASH_MS;
        const g = Math.round(216 + (255 - 216) * t);
        const b = Math.round(74  + (255 - 74)  * t);
        ctx.fillStyle = `rgb(255, ${g}, ${b})`;
      } else {
        ctx.fillStyle = '#ffd84a';
      }
      ctx.fillText(lives, PF_W - 6, 12);

      // Floating "-1" — animates up from just below the LIVES value
      // and fades as t→0. Only rendered while flashFor > 0.
      if (flashFor > 0) {
        const t = flashFor / LIVES_FLASH_MS;
        ctx.save();
        ctx.globalAlpha = t;
        ctx.fillStyle = '#ff6666';
        ctx.font = '7px "Press Start 2P", monospace';
        ctx.fillText('-1', PF_W - 6, 22 - 10 * (1 - t));
        ctx.restore();
      }

      // Transport + ping indicator — tucked into the bottom-left
      // corner of the canvas (below the ship row, mirrors SCORE's
      // top-left position). Out of the HUD strip so it doesn't
      // compete with the gameplay numbers. Single colour-coded line
      // (green/yellow/red on the ping bucket — the alarming bit);
      // transport label drawn muted alongside as context. Hidden
      // in kid view (?clean).
      if (!isClean) {
        const labelMap = { p2p: 'P2P', connecting: 'P2P…', solo: 'SOLO', relay: 'RELAY' };
        const label = labelMap[currentTransport] || 'RELAY';
        // SOLO renders a synthetic 0 ms — gameplay is one local frame,
        // not the DO RTT (which would mislead since the DO isn't in
        // the input path). Other modes still surface lastRTT.
        const isSolo = currentTransport === 'solo';
        let color = '#777777';                                   // unknown ping → muted
        if (isSolo)                color = '#6bff8c';            // green — local sim
        else if (lastRTT != null) {
          if      (lastRTT < 80)   color = '#6bff8c';            // green — snappy
          else if (lastRTT < 180)  color = '#ffd84a';            // yellow — playable
          else                     color = '#ff6666';            // red — laggy
        }
        const pingStr = isSolo ? '0ms' : (lastRTT != null ? `${lastRTT}ms` : '—');
        ctx.font = '5px "Press Start 2P", monospace';
        ctx.textAlign = 'left';
        // Transport label muted; ping coloured. Tiny gap between
        // them so the colour-coded number reads as the headline.
        ctx.fillStyle = '#777777';
        ctx.fillText(label, 6, PF_H - 6);
        const gap = ctx.measureText(label + ' ').width;
        ctx.fillStyle = color;
        ctx.fillText(pingStr, 6 + gap, PF_H - 6);
      }
    }
  }

  let lastSeenStatus = null;
  let attackOverlayUntil = 0;
  let nameFadeStartAt = 0;
  const NAME_FADE_MS = 800;
  // Lives-decrement HUD flash. Set when a snapshot diff sees lives go
  // down; the HUD renderer brightens the LIVES value and floats a
  // "-1" popup above it until this clock passes.
  let livesFlashUntil = 0;
  const LIVES_FLASH_MS = 600;
  // Latest measured RTT (ms) + current transport state. Mirrored to
  // the prescreen meta DOM by applyPong/setTransport AND read by the
  // in-canvas HUD so lag/transport are visible during gameplay too,
  // not just in the lobby. Henry called out a "laggy" round with no
  // visible evidence — this surfaces both at a glance.
  let lastRTT = null;
  let currentTransport = 'relay';

  // Shield bitmap cache. The wire's `shieldsBits` is a base64 string;
  // decode once when it changes, render straight from the cached
  // Uint8Array each frame. SHIELD_X is precomputed by the engine —
  // grab once at module load.
  let shieldBitmap = null;
  let lastShieldsBits = null;
  const SHIELD_X = shieldOffsets();
  function drawCenteredOverlay(text, color, sizePx) {
    ctx.save();
    ctx.font = sizePx + 'px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    ctx.fillText(text, PF_W / 2, PF_H / 2);
    ctx.restore();
  }

  // 16×16 Earth bitmap ported from SP. 'X' = green continent,
  // '/' = pale ice cap, '.' = ocean. Sampled by drawPixelEarth's
  // radial mask so we get a circular planet, not a square.
  const EARTH_BITMAP = [
    '......//........',
    '....XX..........',
    '..XXXXX.XX......',
    '.XXXXXX.XXXX....',
    '.XXXXX..XXXXX...',
    '.XXXXX..XXXXX...',
    '.XXXX...XXXXX...',
    '.XXX....XXXX....',
    '..XX....XXXX....',
    '..XX....XXX.....',
    '..XX....XX......',
    '...X....XX......',
    '...X....XX......',
    '...X.....X......',
    '....X...........',
    '.....//.........',
  ];
  function drawPixelEarth(cx, cy, radius) {
    // Round once — fractional radius makes the dx/dy loops below
    // iterate at fractional steps, drawing 1×1 rects at subpixel
    // positions that anti-alias into a blurry, jittery planet.
    // Integer radius gives crisp 1-pixel growth steps.
    radius = Math.round(radius);
    const r2 = radius * radius;
    const bmW = EARTH_BITMAP[0].length;
    const bmH = EARTH_BITMAP.length;
    for (let dy = -radius; dy <= radius; dy++) {
      for (let dx = -radius; dx <= radius; dx++) {
        if (dx * dx + dy * dy > r2) continue;
        const col = Math.floor((dx + radius) / (2 * radius) * bmW);
        const row = Math.floor((dy + radius) / (2 * radius) * bmH);
        const ch = EARTH_BITMAP[Math.max(0, Math.min(bmH - 1, row))]
                              [Math.max(0, Math.min(bmW - 1, col))];
        ctx.fillStyle = ch === 'X' ? '#4ade80'
                      : ch === '/' ? '#d0e8ff'
                                   : '#2080d8';
        ctx.fillRect(cx + dx, cy + dy, 1, 1);
      }
    }
    // Soft cyan rim on the right for a tiny shadow-side highlight.
    for (let dy = -radius; dy <= radius; dy++) {
      const dxEdge = Math.floor(Math.sqrt(Math.max(0, r2 - dy * dy)));
      if (dxEdge > 0 && Math.abs(dy) < radius - 1) {
        ctx.fillStyle = 'rgba(120, 200, 255, 0.5)';
        ctx.fillRect(cx + dxEdge - 1, cy + dy, 1, 1);
      }
    }
  }

  // Local cutscene clock — first frame phase==='cutscene' is the
  // start instant. Reset on exit so a second win starts the animation
  // from t=0 again. Animation length is server-controlled via
  // CUTSCENE_SEC; this just provides per-frame timing for the
  // animation beats below. Using performance.now() instead of the
  // wire's cutsceneIn keeps the animation smooth even when snapshot
  // updates stutter.
  let cutsceneStartedAt = 0;
  function drawCutscene() {
    const now = performance.now();
    if (cutsceneStartedAt === 0) cutsceneStartedAt = now;
    const tMs = now - cutsceneStartedAt;
    const cx = PF_W / 2;
    const cy = PF_H / 2 - 10;

    // Stable starfield — positions derived from index so they don't
    // flicker frame-to-frame. A few stars twinkle on a slow cycle.
    const STAR_COUNT = 70;
    for (let i = 0; i < STAR_COUNT; i++) {
      const sx = (i * 73 + 17) % PF_W;
      const sy = (i * 137 + 41) % PF_H;
      const twinkles = i % 7 === 0;
      const lit = twinkles ? (Math.floor(tMs / 350 + i) % 2) === 0 : true;
      if (lit) { ctx.fillStyle = twinkles ? '#ffd84a' : '#ffffff'; ctx.fillRect(sx, sy, 1, 1); }
    }

    // Earth grows from a dot to ~46 PF radius over the first 3 s.
    const growT = Math.min(1, tMs / 3000);
    const radius = 3 + growT * 43;
    drawPixelEarth(cx, cy, radius);

    // Ship orbits — starts at t≈2.8 s and keeps orbiting at a
    // constant rate (~1.5 laps per 4 s; orbitT is unbounded by
    // design, the cutscene ends after ~9.5 s = ~2.5 laps total).
    // 8×6 PF sprite mirroring the in-game silhouette so it reads
    // at this zoom. Cyan thrust trail trails the ship by 3 PF stride.
    if (tMs > 2800) {
      const orbitT = (tMs - 2800) / 4000;
      const angle  = orbitT * Math.PI * 3 - Math.PI / 2;
      const orbitR = radius + 18;
      const sx = cx + Math.cos(angle) * orbitR - 4;
      const sy = cy + Math.sin(angle) * orbitR - 3;
      ctx.fillStyle = '#ff7ab8';
      ctx.fillRect(sx,     sy + 4, 8, 2);
      ctx.fillRect(sx + 2, sy + 2, 4, 2);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(sx + 3, sy,     2, 2);
      ctx.fillStyle = '#2dd4ff';
      ctx.fillRect(sx + 3, sy + 3, 2, 1);
      const tailAng = angle - Math.PI;
      for (let k = 1; k <= 3; k++) {
        ctx.fillStyle = k === 1 ? '#2dd4ff' : 'rgba(45, 212, 255, 0.4)';
        ctx.fillRect(cx + Math.cos(tailAng) * (orbitR + k * 3) - 1,
                     cy + Math.sin(tailAng) * (orbitR + k * 3) - 1, 2, 2);
      }
    }

    // Flag planted on the north pole around t≈6 s.
    if (tMs > 6000) {
      const flagAlpha = Math.min(1, (tMs - 6000) / 600);
      ctx.save();
      ctx.globalAlpha = flagAlpha;
      const fx = cx - 1;
      const fy = cy - radius - 14;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(fx, fy, 2, 14);                  // pole
      ctx.fillStyle = '#ffd84a';
      ctx.fillRect(fx + 2, fy + 1, 9, 6);            // gold cloth
      ctx.fillStyle = '#ff3aa1';
      ctx.fillRect(fx + 2, fy + 1, 9, 1);            // pink top stripe
      ctx.fillRect(fx + 2, fy + 6, 9, 1);            // pink bottom stripe
      ctx.fillRect(fx + 5, fy + 3, 3, 2);            // pearl in the middle
      ctx.restore();
    }

    // Star burst from the planet around t≈5 s.
    if (tMs > 5000) {
      const burstT = (tMs - 5000) / 2500;
      ctx.fillStyle = '#ffd84a';
      for (let i = 0; i < 20; i++) {
        const a = (i / 20) * Math.PI * 2;
        const dist = 8 + burstT * 90;
        const sx = cx + Math.cos(a) * dist;
        const sy = cy + Math.sin(a) * dist;
        if (sx < 0 || sx > PF_W || sy < 0 || sy > PF_H) continue;
        ctx.fillRect(sx, sy, 2, 2);
      }
    }

    // EARTH IS SAFE banner — gold drop-shadow + red main on top,
    // splash-marquee style.
    if (tMs > 6800) {
      const textAlpha = Math.min(1, (tMs - 6800) / 500);
      ctx.save();
      ctx.globalAlpha = textAlpha;
      ctx.font = '12px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffd84a';
      ctx.fillText('EARTH IS SAFE', PF_W / 2 + 2, PF_H - 30 + 2);
      ctx.fillStyle = '#ff2020';
      ctx.fillText('EARTH IS SAFE', PF_W / 2, PF_H - 30);
      ctx.restore();
    }
  }

  // UFO warble — fires every UFO_WARBLE_MS while a UFO is on-screen.
  // Tracked client-side (server doesn't drive audio) so each device
  // hears its own warble in time. Reset accumulator when no UFO so a
  // fresh spawn starts on the first frame.
  const UFO_WARBLE_MS = 100;
  let ufoWarbleAt = 0;
  function tickUfoWarble(now) {
    const snap = snapBuffer[snapBuffer.length - 1];
    if (!snap || !snap.ufo) { ufoWarbleAt = 0; return; }
    if (now >= ufoWarbleAt) {
      const progress = Math.max(0, Math.min(1, snap.ufo.x / PF_W));
      synth.ufoWarble(progress);
      ufoWarbleAt = now + UFO_WARBLE_MS;
    }
  }

  function rafLoop(now) {
    const t = now || performance.now();
    stepLocal(t);
    renderInterpolated();
    tickUfoWarble(t);
    requestAnimationFrame(rafLoop);
  }
  requestAnimationFrame(rafLoop);

  // Boot
  connect();
</script>
</body>
</html>
