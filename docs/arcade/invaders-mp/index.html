<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Invaders MP — spike</title>
<link rel="stylesheet" href="../shared/pixel-font.css">
<link rel="stylesheet" href="../shared/cabinet.css">
<link rel="stylesheet" href="../shared/touch.css">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; color: #fff;
    /* Press Start 2P drives the arcade look; system mono is the
       fallback while the .ttf is loading. */
    font-family: 'Press Start 2P', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    line-height: 1.4;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  /* Canvas centring + crisp pixel-art scaling. cabinet.css has a
     `canvas { width: 100%; height: 100% }` rule for games whose
     engines size the bitmap to the tube; MP keeps a fixed 260×280
     bitmap and rescales via fitCanvas's inline style.width/height
     (integer multiples → no sub-pixel blur). The .tube canvas
     selector is more specific so this wins. */
  .tube {
    display: flex;
    align-items: center;
    justify-content: center;
    /* Extend the playfield's navy gradient over the whole tube so
       the canvas's edges blend invisibly into the surrounding cabinet
       area (the canvas itself paints the same gradient internally).
       Shared cabinet.css defaults .tube to solid #000; override here
       just for MP. Vertical gradient matches the canvas one stop-for-
       stop (#0d1a60 top → #050a30 bottom). */
    background: linear-gradient(180deg, #0d1a60 0%, #050a30 100%);
  }
  .tube canvas {
    width: auto; height: auto;
    /* No image-rendering — fitCanvas sizes the canvas to its CSS
       display size × DPR (SP's approach), so there's no
       browser-level upscale to control. The canvas bitmap is at
       device-pixel resolution; the in-engine ctx.setTransform maps
       PF coords directly. Crisp at any scale, no nearest-neighbour
       8→12 warping. */
  }

  /* Touch-device safe-area. Shared cabinet.css drops .screen padding
     to 0 on coarse pointers (edge-to-edge phone look), which strips
     the browser-chrome insets too — on iPad landscape Safari that
     lets the cabinet extend under the toolbar and crops the HUD +
     top invader row. Re-add the safe-area insets so content always
     lives inside the visible region. */
  @media (pointer: coarse) {
    #stage.screen {
      padding-top:    env(safe-area-inset-top);
      padding-right:  env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left:   env(safe-area-inset-left);
    }
  }

  /* Prescreen — covers the tube while the game is in the waiting,
     ready, or gameover states (the lobby/restart UI). Hidden during
     countdown + running, when .tube.is-ready is set by refreshLobby
     — that single class swap toggles canvas visibility AND prescreen
     visibility together, so 3-2-1 and live gameplay paint on a clear
     canvas. overflow-y: auto so a small portrait viewport can scroll
     if the big-START + QR push past the fold. */
  #prescreen {
    position: absolute;
    inset: 0;
    z-index: 5;                          /* below cabinet.css overlay (z=10) */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 20px;
    text-align: center;
    background:
      radial-gradient(ellipse at center, rgba(10,10,40,0.78), rgba(0,0,0,0.92));
    overflow-y: auto;
    transition: opacity 0.3s ease;
  }
  .tube.is-ready #prescreen {
    opacity: 0;
    pointer-events: none;
  }

  /* Diagnostic line (netcode / ping / transport) + Retry P2P button.
     Visible by default during the testing phase — they're genuinely
     useful for spotting bad transport / version mismatches. The URL
     ?clean query hides them via body.is-clean for the kid view, and
     we'll flip the default back to "hidden unless ?debug" at release. */
  body.is-clean #prescreen .meta,
  body.is-clean #prescreen #retryBtn {
    display: none;
  }

  #prescreen .title {
    font-size: 18px; letter-spacing: 0.3em; color: #2dd4ff;
    margin: 0;
  }

  #prescreen .room-line {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  #prescreen .room-label {
    font-size: 9px; letter-spacing: 0.25em;
    color: rgba(255, 255, 255, 0.5);
  }
  #prescreen .room-code {
    font-size: 44px; letter-spacing: 0.22em;
    color: #ffd84a;
    text-shadow: 4px 4px 0 #ff3aa1;
    line-height: 1;
  }

  /* QR card — large + centred so it's the obvious "show this to your
     friend" target. Subtle Copy-link sits underneath for the cases
     where scanning isn't possible (parent texting a URL, etc.). */
  #prescreen .qr-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  #prescreen .qr {
    background: #fff;
    padding: 10px;
    border-radius: 6px;
    line-height: 0;                 /* kill stray inline-img descender gap */
  }
  #prescreen .qr img {
    display: block;
    width: 180px; height: 180px;
    image-rendering: pixelated;
  }
  #prescreen .qr-share {
    background: transparent; color: rgba(255,255,255,0.55);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 3px;
    padding: 5px 12px; font: inherit; font-size: 9px;
    letter-spacing: 0.12em; cursor: pointer;
  }
  #prescreen .qr-share:hover {
    color: #fff; border-color: rgba(255,255,255,0.45);
  }

  /* Player slots — bigger cards for chunky touch targets + kid-readable
     name text. Per-seat colour matches in-game SHIP_COLORS. */
  #prescreen .players {
    display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
  }
  #prescreen .player-slot {
    border: 2px solid currentColor;
    border-radius: 6px;
    padding: 10px 14px;
    min-width: 84px;
    opacity: 0.28;
    text-align: center;
    transition: opacity 0.2s ease;
  }
  #prescreen .player-slot.is-active { opacity: 1; }
  #prescreen .player-slot .ps-label {
    font-size: 9px; letter-spacing: 0.22em;
  }
  #prescreen .player-slot .ps-name {
    margin-top: 8px;
    font-size: 11px; color: #fff;
    min-height: 1em; letter-spacing: 0.06em;
    word-break: break-word;
  }
  #prescreen .player-slot.is-empty .ps-name {
    color: rgba(255,255,255,0.4);
    font-style: italic;
  }
  #prescreen .player-slot .ps-you {
    display: block;
    margin-top: 5px;
    font-size: 7px; letter-spacing: 0.28em;
    color: rgba(255,255,255,0.65);
  }
  #prescreen .player-slot[data-seat="p1"] { color: #2dd4ff; }
  #prescreen .player-slot[data-seat="p2"] { color: #ff3aa1; }
  #prescreen .player-slot[data-seat="p3"] { color: #6bff8c; }
  #prescreen .player-slot[data-seat="p4"] { color: #ffd84a; }

  /* Name input — bigger + centred so it doesn't look like a tiny
     dev field. */
  #prescreen .name-input {
    background: #0a0a28; color: #fff;
    border: 2px solid #2dd4ff; border-radius: 4px;
    padding: 10px 14px; font: inherit; font-size: 13px;
    letter-spacing: 0.1em; width: 220px; max-width: 80vw;
    text-align: center;
  }
  #prescreen .name-input::placeholder { color: rgba(255,255,255,0.35); }

  /* Big-start — the obvious primary action. Drop shadow + idle pulse
     pulls the eye to "tap me". Disabled state is muted grey so it
     doesn't compete for attention while we're still connecting. */
  .big-start {
    background: #ff3aa1; color: #fff;
    border: 0; border-radius: 6px;
    padding: 18px 56px; font: inherit; font-size: 22px;
    letter-spacing: 0.22em; cursor: pointer;
    box-shadow: 0 4px 0 #b32271, 0 6px 14px rgba(255,58,161,0.4);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .big-start:not(:disabled):hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 0 #b32271, 0 8px 18px rgba(255,58,161,0.5);
  }
  .big-start:not(:disabled):active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #b32271, 0 3px 6px rgba(255,58,161,0.3);
  }
  .big-start:disabled {
    background: #2a2a3a; color: rgba(255,255,255,0.4);
    cursor: not-allowed; box-shadow: none;
  }
  @keyframes start-pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.04); }
  }
  .big-start:not(:disabled) {
    animation: start-pulse 1.8s ease-in-out infinite;
  }
  /* Respect users who've opted out of motion. The pulse and the
     hover/active transform/box-shadow shifts can be vestibular
     triggers; flatten them. */
  @media (prefers-reduced-motion: reduce) {
    .big-start,
    .big-start:not(:disabled) {
      animation: none;
      transition: none;
    }
    .big-start:not(:disabled):hover,
    .big-start:not(:disabled):active {
      transform: none;
    }
  }

  #prescreen #status {
    font-size: 11px; color: #ffd84a; min-height: 1.2em;
    letter-spacing: 0.08em;
  }

  /* End-of-run overlay. Covers the lobby (QR / players / name /
     START / status / debug bar) with a focused gameover screen:
     headline, big score, and — if qualifying — initials entry.
     Positioned absolute over .tube so the prescreen below stays
     untouched (we just hide it visually). */
  #endscreen {
    position: absolute;
    inset: 0;
    background: rgba(2, 10, 28, 0.96);     /* near-opaque navy */
    z-index: 50;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    padding: 24px;
    text-align: center;
  }
  /* The explicit display: flex above wins over the default
     `[hidden] { display: none }`, so without this override the
     overlay would stay visible on page load (it's hidden by default
     in the HTML so fresh visitors would see a stale "EARTH IS SAFE"
     screen they can't dismiss). Same fix for #go-initials below. */
  #endscreen[hidden] { display: none; }
  #endscreen .es-headline {
    font-size: 16px; letter-spacing: 0.15em;
    color: #ffd84a;
  }
  /* Loss variant — red headline. JS toggles `.is-loss` on the
     headline element. */
  #endscreen .es-headline.is-loss {
    color: #ff5050;
  }
  #endscreen .es-score-label {
    font-size: 8px; letter-spacing: 0.2em;
    color: rgba(255, 255, 255, 0.55);
    margin-top: 4px;
  }
  #endscreen .es-score {
    font-size: 36px;
    color: #ffffff;
    margin-bottom: 8px;
  }
  #endscreen .es-hint {
    font-size: 6px; letter-spacing: 0.1em;
    color: rgba(255, 255, 255, 0.45);
    margin-top: 6px;
  }
  #endscreen .es-lb-msg {
    font-size: 9px; letter-spacing: 0.12em;
    color: #6bff8c;
    min-height: 1.2em;
  }
  #endscreen .es-lb-msg.is-warn {
    color: #ffd84a;
  }

  /* Top-10 leaderboard table. Tight 3-column grid (rank · initials
     · score) so 10 rows fit even on iPhone-SE width. Player's own
     row highlighted when it appears (matches submitted initials).  */
  #endscreen .es-leaderboard {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 8px; letter-spacing: 0.12em;
    color: rgba(255, 255, 255, 0.7);
    margin-top: 4px;
  }
  #endscreen .es-leaderboard[hidden] { display: none; }
  #endscreen .es-lb-label {
    color: #ffd84a;
  }
  #endscreen .es-lb-list {
    list-style: none; margin: 0; padding: 0;
    display: grid;
    grid-template-columns: max-content max-content max-content;
    column-gap: 14px; row-gap: 3px;
    align-items: baseline;
  }
  #endscreen .es-lb-list li { display: contents; }
  #endscreen .es-lb-list .rank     { color: rgba(255,255,255,0.4); text-align: right; }
  #endscreen .es-lb-list .initials { color: #ffffff; text-align: left; }
  #endscreen .es-lb-list .score    { color: #ffd84a; text-align: right; }
  #endscreen .es-lb-list li.is-mine .rank,
  #endscreen .es-lb-list li.is-mine .initials,
  #endscreen .es-lb-list li.is-mine .score {
    color: #6bff8c;
  }

  /* Initials entry inside the endscreen. Three slots side-by-side;
     the active slot pulses gold/white. */
  #go-initials {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  #go-initials[hidden] { display: none; }
  #go-initials .go-initials-label {
    font-size: 9px; letter-spacing: 0.1em; color: #ffd84a;
  }
  #go-initials .go-slot-row {
    display: flex; gap: 14px; justify-content: center;
  }
  #go-initials .go-slot {
    display: inline-block;
    min-width: 32px; padding: 8px 10px;
    font-size: 28px; letter-spacing: 0.1em;
    color: rgba(255, 255, 255, 0.4);
    border-bottom: 3px solid rgba(255, 216, 74, 0.25);
    user-select: none;
  }
  #go-initials .go-slot.is-active {
    color: #ffd84a;
    border-bottom-color: #ffd84a;
    animation: go-slot-pulse 0.9s ease-in-out infinite;
  }
  @keyframes go-slot-pulse {
    50% { color: #ffffff; border-bottom-color: #ffffff; }
  }

  /* Debug-mode bottom row: meta + Retry P2P. Only shown when
     body.is-debug (set when URL has ?debug). */
  #prescreen .meta {
    margin-top: 6px;
    font-size: 8px; letter-spacing: 0.1em;
    color: rgba(255, 255, 255, 0.4);
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  }
  #prescreen .netcode.mismatch { color: #ff6666; }
  #prescreen .ping.low  { color: #6bff8c; }
  #prescreen .ping.mid  { color: #ffd84a; }
  #prescreen .ping.high { color: #ff6666; }
  #prescreen .transport {
    padding: 1px 6px; border-radius: 3px; text-transform: uppercase;
    background: rgba(255, 255, 255, 0.06);
    color: rgba(255, 255, 255, 0.55);
  }
  #prescreen .transport.p2p        { color: #1a3a1a; background: #6bff8c; font-weight: bold; }
  #prescreen .transport.connecting { color: #ffd84a; background: rgba(255, 216, 74, 0.15); }
  #prescreen #retryBtn {
    background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.55);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 3px;
    padding: 4px 10px; font: inherit; font-size: 9px;
    letter-spacing: 0.1em; cursor: pointer;
  }

  /* Pink fire button — same colour recipe as SP's invaders/. */
  .touch-controls .tc-fire-btn {
    border-color: rgba(255, 58, 161, 0.7);
    color: #ff3aa1;
  }
  .touch-controls .tc-fire-btn:active,
  .touch-controls .tc-fire-btn.is-pressed {
    background: rgba(255, 58, 161, 0.25);
    border-color: #ff3aa1;
    color: #fff;
  }
</style>
</head>
<body>
<!-- Cabinet shell — bezel + tube + CRT scanlines + vignette come from
     shared/cabinet.css. The tube starts WITHOUT .is-ready so the
     canvas is hidden and the prescreen overlay covers it; refreshLobby
     adds .is-ready when game status flips to 'running' (canvas reveals,
     prescreen fades). On gameover the class is removed → prescreen
     comes back so a player can hit Start again to replay. -->
<div id="stage" class="screen">
  <div class="tube">
    <canvas id="cv" width="260" height="280"></canvas>
    <div class="overlay"></div>
    <div class="vignette"></div>
    <div class="touch-controls">
      <div class="tc-group">
        <button type="button" class="tc-btn" id="tc-left"  aria-label="Move left"  tabindex="-1">◀</button>
        <button type="button" class="tc-btn" id="tc-right" aria-label="Move right" tabindex="-1">▶</button>
      </div>
      <div class="tc-group">
        <button type="button" class="tc-btn tc-fire-btn" id="tc-fire" aria-label="Fire" tabindex="-1">FIRE</button>
      </div>
    </div>
    <div id="prescreen">
      <div class="title">INVADERS</div>

      <div class="room-line">
        <span class="room-label">ROOM</span>
        <span class="room-code" id="roomCode">····</span>
      </div>

      <!-- QR is the headline share target — friends scan to join.
           Copy-link sits underneath as the parent-helps-out fallback. -->
      <div class="qr-wrap">
        <div class="qr" id="qr"></div>
        <button id="copyBtn" class="qr-share" type="button">Copy link</button>
      </div>

      <!-- One slot per seat, colour-coded. Dimmed when empty, lit when
           occupied, with a YOU badge on the local seat. -->
      <div class="players">
        <div class="player-slot" data-seat="p1"><div class="ps-label">P1</div><div class="ps-name">—</div></div>
        <div class="player-slot" data-seat="p2"><div class="ps-label">P2</div><div class="ps-name">—</div></div>
        <div class="player-slot" data-seat="p3"><div class="ps-label">P3</div><div class="ps-name">—</div></div>
        <div class="player-slot" data-seat="p4"><div class="ps-label">P4</div><div class="ps-name">—</div></div>
      </div>

      <input id="nameInput" class="name-input" maxlength="12" placeholder="Your name" autocomplete="off" autocapitalize="off" spellcheck="false">

      <button id="startBtn" class="big-start" disabled>START</button>

      <div id="status">Connecting…</div>

      <!-- Diagnostic line + dev controls; only visible when the URL
           has ?debug (CSS hides .meta + #retryBtn unless body.is-debug). -->
      <div class="meta">
        <span id="netcode" class="netcode">netcode v?</span>
        <span id="ping" class="ping"></span>
        <span id="transport" class="transport">relay</span>
      </div>
      <button id="retryBtn" title="Force a fresh WebRTC handshake (use if the badge is stuck on relay after a late join)">Retry P2P</button>
    </div>

    <!-- End-of-run overlay. Covers the lobby on gameover so the
         focus is the player's own score + (if qualifying) initials
         entry, instead of competing with the QR / players / name /
         START / status / debug-meta stack. Sequence:
            won/lost → endscreen visible with headline + big score
            qualifies → initials block visible (slots + hint)
            submit   → "SAVED AS ABC!" + PLAY AGAIN button shown
            not qualifying → PLAY AGAIN button shown immediately
         Tap PLAY AGAIN to hide the overlay and start a fresh round. -->
    <div id="endscreen" hidden>
      <div id="es-headline" class="es-headline">EARTH IS SAFE</div>
      <div class="es-score-label">SCORE</div>
      <div id="es-score" class="es-score">0</div>

      <!-- Initials entry. Hidden until the player's score qualifies.
           The shared Arcade.Initials state machine drives selection
           via keyboard or the touch controls (left/right cycle a
           letter, FIRE/SELECT advances; submits on the last slot). -->
      <div id="go-initials" hidden>
        <div class="go-initials-label">NEW HI-SCORE — ENTER INITIALS</div>
        <div class="go-slot-row">
          <span class="go-slot is-active" data-slot="0">A</span>
          <span class="go-slot"           data-slot="1">A</span>
          <span class="go-slot"           data-slot="2">A</span>
        </div>
        <div class="es-hint">USE KEYBOARD OR ← → BUTTONS · FIRE/SELECT TO ADVANCE</div>
      </div>

      <!-- Single-line leaderboard status. One of:
           - "TEST RUN — SCORE NOT SAVED" (cheated)
           - "BEAT 2710 TO MAKE THE LEADERBOARD" (non-qualifying)
           - "SCORE SAVED AS DAD" (after successful submit)
           - hidden (while initials block is open and prompting). -->
      <div id="es-lb-msg" class="es-lb-msg" hidden></div>

      <!-- Top-10 leaderboard. Always visible on the endscreen so the
           player has context for "did I make it?" (and a target if
           they didn't). Populated from Arcade.Leaderboard.read()
           which is kept in sync by the refresh() call on init + the
           submit() responses. -->
      <div id="es-leaderboard" class="es-leaderboard" hidden>
        <div class="es-lb-label">TOP SCORES</div>
        <ol class="es-lb-list"></ol>
      </div>

      <!-- Tap hint — same auto-dismiss as the timer, but tells the
           user the overlay will go away on its own + that they can
           tap to skip the wait. Hidden during initials entry so it
           doesn't compete with the slots / instruction. -->
      <div id="es-dismiss-hint" class="es-hint" hidden>TAP ANYWHERE TO CONTINUE</div>
    </div>
  </div>
</div>

<!-- SFX fallback elements — used by Arcade.Audio.play() in the brief
     window between page load and the WebAudio buffer decode finishing.
     Their ids MUST match the keys passed to Arcade.Audio.init below. -->
<audio id="sfx-shoot"     src="../invaders/sfx-shoot.mp3" preload="auto"></audio>
<audio id="sfx-kill"      src="../invaders/sfx-kill.wav"  preload="auto"></audio>
<audio id="sfx-explosion" src="../shared/sfx-explosion.mp3" preload="auto"></audio>
<audio id="sfx-lose"      src="../shared/sfx-lose.mp3"      preload="auto"></audio>

<script src="../shared/audio.js"></script>
<script src="../shared/leaderboard.js"></script>
<script src="../shared/initials.js"></script>
<script src="./simple-peer.min.js"></script>
<!-- Kazuhiko Arase's qrcode-generator (MIT) — used to draw the
     join-link QR in the prescreen lobby. Vendored locally so the
     arcade site stays self-contained (no third-party CDN runtime). -->
<script src="./qrcode.min.js"></script>
<script type="module">
  // Single source of truth for game logic, shared with the server
  // (which bundles this same file via wrangler import).
  // Namespace import (not destructured `import { ... }`) so a missing
  // export from a stale-cached engine.js doesn't hard-fail the module
  // link and white-screen the page. Destructure below; any missing
  // member becomes `undefined` rather than a load-time error, so the
  // page still renders (just hides the affected feature) during a
  // brief deploy-crossover window.
  import * as engine from './engine.js';
  const {
    initState, step, snapshotForClient, zeroInput,
    PF_W, PF_H, SHIP_W, SHIP_H, SHIP_Y, SHIP_SPEED, FIRE_COOLDOWN,
    BULLET_W, BULLET_H, BULLET_SPEED,
    INV_W, INV_H, INV_COLS,
    SHIELD_W, SHIELD_H, SHIELD_COUNT, SHIELD_Y,
    decodeShields, shieldOffsets,
    SUPER_SHOT_MAX, CHARGE_THRESHOLD_SEC,
    CHARGED_BULLET_W, CHARGED_BULLET_H, CHARGED_BULLET_SPEED,
    UFO_W_EXPORT, UFO_H_EXPORT, UFO_Y_EXPORT,
    BOSS_W, BOSS_H, BOSS_Y,
    comboMultiplier,
    SEATS, MAX_SEATS,
  } = engine;
  // Local aliases so the renderer reads UFO_W / UFO_H / UFO_Y like the
  // engine code does, without colliding with anything else.
  const UFO_W = UFO_W_EXPORT ?? 16;
  const UFO_H = UFO_H_EXPORT ?? 7;
  const UFO_Y = UFO_Y_EXPORT ?? 12;
  // Namespace import + destructure for the same reason as engine.js
  // above — a stale cached sprites.js mid-deploy that's missing the
  // new exports (paintClaude / CLAUDE_COLOUR landed in #599) would
  // hard-fail the module link and white-screen the page. With the
  // namespace form, missing members are just `undefined` and the
  // affected feature (Claude render) silently no-ops.
  import * as sprites from './sprites.js';
  const {
    ROW_COLORS, spriteForRow, paintPixels, paintShip, paintBoss,
    paintClaude, CLAUDE_COLOUR,
  } = sprites;
  const CLAUDE_ROW = 3;  // 0-indexed; row 3 + 4 are octopus, Claude rides the upper octopus row
  // Renderer uses INV_COLS to map invader array index → grid row. It
  // happens to equal 11 in the current engine; mirror as a const so a
  // future engine.INV_COLS change forces an audit here rather than
  // silently picking up a different value (the sprite-row map +
  // bullet-fire column logic depend on it).
  const SPRITE_COLS = INV_COLS ?? 11;

  // Register SFX with the shared audio module. The volume/muted keys
  // are the global arcade keys so the slider state carries across
  // every arcade game (SP Invaders, Space Jumper, …).
  Arcade.Audio.init({
    sfx: {
      'sfx-shoot':     '../invaders/sfx-shoot.mp3',
      'sfx-kill':      '../invaders/sfx-kill.wav',
      'sfx-explosion': '../shared/sfx-explosion.mp3',
      'sfx-lose':      '../shared/sfx-lose.mp3',
    },
    volumeKey: 'oyster-arcade-sfx-volume',
    mutedKey:  'oyster-arcade-sfx-muted',
  });

  // Synth — small WebAudio helper for the iconic Invaders sounds
  // that aren't MP3-sampled: the march heartbeat (4-note loop that
  // speeds up with the swarm) and the UFO warble. Ported verbatim
  // from SP's `synth` IIFE (sp index.html ~L313). Uses the shared
  // Arcade.Audio master volume so the cabinet's mute switch works.
  const synth = (function () {
    let actx = null;
    function ensure() {
      if (actx) { if (actx.state === 'suspended') actx.resume().catch(()=>{}); return actx; }
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        actx = new Ctx();
      } catch (_) { return null; }
      return actx;
    }
    function masterVol() {
      return (window.Arcade && Arcade.Audio && Arcade.Audio.getVolume) ? Arcade.Audio.getVolume() : 1;
    }
    function blip(freqStart, freqEnd, durMs, gain, type) {
      const c = ensure(); if (!c) return;
      const v = masterVol() * (gain || 0.25);
      if (v <= 0) return;
      const t = c.currentTime;
      const dur = durMs / 1000;
      const osc = c.createOscillator();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freqStart, t);
      osc.frequency.linearRampToValueAtTime(freqEnd, t + dur);
      const g = c.createGain();
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g).connect(c.destination);
      osc.start(t);
      osc.stop(t + dur);
    }
    // March heartbeat — four notes E2, D2, C2, B1 looped, advancing
    // by one beat each call. Caller schedules calls at the march
    // tempo (sped up by the swarm thinning).
    const MARCH_NOTES = [82.41, 73.42, 65.41, 61.74];
    let marchIdx = 0;
    function march() { blip(MARCH_NOTES[marchIdx % 4], MARCH_NOTES[marchIdx % 4], 110, 0.18, 'square'); marchIdx++; }
    function marchReset() { marchIdx = 0; }
    // UFO siren — sine sweep up-down, called every ~100 ms while
    // a UFO is on screen. `t` is the UFO's progress across the
    // playfield (0..1) — drives a subtle pitch wobble on top of
    // the carrier wobble inside.
    function ufoWarble(t) {
      const f = 480 + Math.sin(t * Math.PI * 8) * 90;
      blip(f, f, 100, 0.13, 'sine');
    }
    return { ensure, march, marchReset, ufoWarble };
  })();

  // Leaderboard — same `'invaders'` game key as SP so MP per-player
  // scores share one hi-score table with any legacy SP scores. Top
  // 10 displayed. `qualifies()` reads the local mirror; `submit()`
  // posts to /api/leaderboard. refresh() pulls the latest list from
  // the worker into the local mirror so `qualifies()` is correct
  // for first-time visitors (otherwise an empty localStorage would
  // accept any positive score as a hi-score).
  Arcade.Leaderboard.init({ game: 'invaders', max: 10 });
  Arcade.Leaderboard.refresh();

  // Per-seat colours for the canvas. Indexed by seat position so the
  // same player reads as the same colour on every viewer's screen.
  // Previously every viewer drew themselves in cyan, which collided
  // with p1's palette entry and made p1 + the local player look
  // identical on p2's iPad.
  const SHIP_COLORS = ['#2dd4ff', '#ff3aa1', '#6bff8c', '#ffd84a'];

  const NAME_STORAGE_KEY = 'invaders-mp.name';
  const NAME_MAX_CHARS = 12;

  // Netcode version — bump on any wire/protocol or behaviour change.
  // Welcome from the server includes its own value so we can flag a
  // mismatch (usually means one side is still on a stale deploy or the
  // browser is showing a cached HTML). See server room.ts for history.
  const NETCODE_VERSION = 31;

  // --------------------------------------------------------------------
  // Room code — 4 letters that identifies this room's DO instance.
  // URL shape: /invaders-mp/FROG. The arcade-site worker rewrites any
  // /invaders-mp/<segment> to serve this same index.html, so we can
  // read the code straight off location.pathname. Falls back to the
  // older ?code= query for any bookmarks. Charset omits O / I / L to
  // avoid ambiguity when typing.
  function randomCode() {
    const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ';
    const arr = new Uint8Array(4);
    crypto.getRandomValues(arr);
    let s = '';
    for (let i = 0; i < 4; i++) s += chars[arr[i] % chars.length];
    return s;
  }
  function normaliseCode(raw) {
    return (raw || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  }
  function extractCode() {
    const m = location.pathname.match(/^\/invaders-mp\/([^/]+)\/?$/);
    if (m) {
      const c = normaliseCode(m[1]);
      if (c.length === 4) return c;
    }
    const q = new URL(location.href).searchParams.get('code');
    const c2 = normaliseCode(q);
    if (c2.length === 4) return c2;
    return null;
  }
  let roomCode = extractCode();
  if (!roomCode) roomCode = randomCode();
  // Normalise the address bar to the clean path form regardless of how
  // we arrived — query-string bookmarks rewrite themselves on first
  // load and stay shareable in the new form. We preserve ?clean across
  // the rewrite so the kid-view bookmark survives reloads.
  const isClean = new URLSearchParams(location.search).has('clean');
  const cleanPath = '/invaders-mp/' + roomCode + (isClean ? '?clean' : '');
  if ((location.pathname + location.search) !== cleanPath) {
    history.replaceState(null, '', cleanPath);
  }

  // --------------------------------------------------------------------
  // WS URL: prod → wss://arcade.oyster.to. Anything else → ws://<host>:8787
  // (the wrangler dev default). The arcade-site is on a different port
  // in local dev, so just hit wrangler dev directly.
  const isProd = location.hostname === 'arcade.oyster.to';
  const wsBase = isProd
    ? 'wss://arcade.oyster.to/api/mp/invaders/ws'
    : 'ws://' + location.hostname + ':8787/api/mp/invaders/ws';
  const wsUrl = wsBase + '?code=' + roomCode;

  document.getElementById('roomCode').textContent = roomCode;
  renderQR(location.href);

  // ?clean on the URL hides the diagnostic meta line + Retry P2P for
  // the kid view. Default is to show them — they're handy while we're
  // actively testing. Flag captured before history.replaceState above
  // so the original ?clean survives path normalisation.
  if (isClean) document.body.classList.add('is-clean');

  // QR code for the join URL. Type 0 = auto-fit the smallest matrix
  // that fits the URL; 'M' = medium error-correction (handles a 7-bit
  // ASCII URL of this length comfortably and tolerates the small bit
  // of camera blur on a phone). createImgTag emits a data-URL <img>;
  // we size it via CSS in .qr img.
  function renderQR(url) {
    const el = document.getElementById('qr');
    if (!el || typeof qrcode === 'undefined') return;
    const qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    el.innerHTML = qr.createImgTag(4, 0);
  }

  const netcodeEl = document.getElementById('netcode');
  const pingEl    = document.getElementById('ping');
  // Show client version immediately on load; server version overwrites
  // this once the welcome arrives.
  netcodeEl.textContent = 'netcode v' + NETCODE_VERSION;

  // Ping/pong RTT measurement — every PING_INTERVAL_MS the client
  // stamps performance.now() into a ping, the server echoes the same
  // stamp straight back, and we diff on receive to get the round-trip.
  // CS-style colour bands: green/yellow/red at 80/180 ms.
  const PING_INTERVAL_MS = 2000;
  let pingTimer = null;

  function startPings() {
    if (pingTimer) return;
    sendPing();
    pingTimer = setInterval(sendPing, PING_INTERVAL_MS);
  }
  function stopPings() {
    if (pingTimer) clearInterval(pingTimer);
    pingTimer = null;
    pingEl.textContent = '';
    pingEl.classList.remove('low', 'mid', 'high');
  }
  function sendPing() {
    // Prefer DC when up so the badge reflects actual LAN RTT instead
    // of the cloud round-trip. Pings are pairwise — host (P1) pings
    // each connected peer; clients ping P1. Either side echoes pong.
    const m = { type: 'ping', t: performance.now() };
    if (anyPeerConnected()) {
      if (mySeat === 'p1') {
        for (const p of peers.values()) {
          if (p.connected) try { p.send(JSON.stringify(m)); } catch {}
        }
      } else {
        sendToHost(m);
      }
      return;
    }
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(m));
  }

  // Client-authoritative position publish. While the WS is open and
  // we have a local position, send it to the server every
  // POS_PUBLISH_MS — server overwrites ship.x straight from this,
  // which then feeds the next snapshot the other player sees.
  function startPosPublish() {
    if (posTimer) return;
    posTimer = setInterval(() => {
      if (localShip.x === null) return;
      sendToServer({ type: 'pos', x: localShip.x });
    }, POS_PUBLISH_MS);
  }
  function stopPosPublish() {
    if (posTimer) clearInterval(posTimer);
    posTimer = null;
  }
  function applyPong(serverT) {
    const rtt = Math.round(performance.now() - serverT);
    lastRTT = rtt;
    pingEl.textContent = rtt + ' ms';
    pingEl.classList.remove('low', 'mid', 'high');
    if      (rtt < 80)  pingEl.classList.add('low');
    else if (rtt < 180) pingEl.classList.add('mid');
    else                pingEl.classList.add('high');
  }

  // --------------------------------------------------------------------
  // Lobby
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const copyBtn  = document.getElementById('copyBtn');

  function setStatus(t) { statusEl.textContent = t; }

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(location.href);
      const orig = copyBtn.textContent;
      copyBtn.textContent = 'Copied';
      setTimeout(() => { copyBtn.textContent = orig; }, 1200);
    } catch (e) { /* no clipboard permission; ignore */ }
  });

  // Name input: persisted to localStorage so it survives reloads.
  // Sent to the server (or host, in P2P mode) via sendToServer, which
  // routes to whichever transport is active. We send on each change
  // (no debounce — name updates are rare and tiny).
  const nameInput = document.getElementById('nameInput');
  let myName = '';
  try { myName = (localStorage.getItem(NAME_STORAGE_KEY) || '').slice(0, NAME_MAX_CHARS); } catch {}
  nameInput.value = myName;
  function publishName() {
    try { localStorage.setItem(NAME_STORAGE_KEY, myName); } catch {}
    sendToServer({ type: 'name', name: myName });
  }
  nameInput.addEventListener('input', () => {
    myName = nameInput.value.slice(0, NAME_MAX_CHARS);
    publishName();
  });

  // --------------------------------------------------------------------
  // WebSocket + snapshot buffer
  //
  // The server stamps each snapshot with `t` (Date.now() at broadcast).
  // We keep the last ~2 s of snapshots and render 100 ms behind the
  // latest one, lerping ship + invader positions between the two
  // snapshots that bracket renderTime. This is the Valve "interp"
  // buffer — it absorbs server-tick cadence + network jitter without
  // changing the protocol. Bullets are drawn straight from the latest
  // snapshot (no per-bullet id on the wire).
  const INTERP_DELAY_MS = 100;
  const BUFFER_KEEP_MS  = 2000;
  // Position publish rate. Server ticks at 60 Hz; matching that keeps
  // the other player's view of us at most one publish interval stale.
  const POS_PUBLISH_MS = 16;
  // Ghost bullets spawn locally on FIRE so the shot feels instant,
  // then fade after this window — by which time the server's
  // authoritative bullet has appeared in a snapshot. The brief
  // overlap during handoff reads cleaner than the ~150 ms gap of
  // pure server-snapshot bullets.
  const GHOST_TTL_MS = 150;

  let mySeat = null;
  let lastState = null;     // latest snapshot, used by lobby UI
  let ws = null;

  const snapBuffer = [];    // [{ t, status, won, score, players, bullets, invaderBullets, invaders }, ...]
  let latestServerT     = 0;
  let latestLocalRecvMs = 0;

  // Local prediction state — only the seat we own. Integrated from
  // input each rAF frame using server-identical physics, snapped to the
  // server when we diverge (network drops, death/respawn).
  const localShip = { x: null, cooldown: 0, holdSec: 0, wasFiring: false };
  const ghostBullets = []; // [{ x, y, born }] — locally-predicted, fade after GHOST_TTL_MS
  let prevFrameT = 0;
  let posTimer = null;

  // --------------------------------------------------------------------
  // Host runtime — active on P1 when hostEngaged. Owns hostState +
  // hostInputs, runs a setInterval loop at HOST_TICK_HZ, broadcasts
  // each snapshot over the DataChannel and also feeds it into the
  // local snapBuffer via handle() so P1's existing render path works.
  const HOST_TICK_HZ = 60;
  const HOST_TICK_MS = 1000 / HOST_TICK_HZ;
  let hostEngaged = false;            // true after Start in P2P mode this session
  let hostState   = null;
  let hostInputs  = freshHostInputs();
  let hostLoop    = null;
  let hostLastMs  = 0;

  function freshHostInputs() {
    const out = {};
    for (const s of SEATS) out[s] = zeroInput();
    return out;
  }

  function startHost() {
    if (mySeat !== 'p1') return;
    hostState = initState();
    // Carry over names from the latest snapshot we've seen so other
    // players' labels don't blank when host mode first engages — the
    // names lived on the cloud-relay server until this moment. Also
    // covers restarts (gameover → Start again).
    const latest = snapBuffer[snapBuffer.length - 1];
    if (latest && latest.players) {
      for (let i = 0; i < MAX_SEATS; i++) {
        hostState.names[SEATS[i]] = latest.players[i]?.name || '';
      }
    }
    hostState.status = 'countdown';
    hostState.countdownEndMs = Date.now() + 3000;
    hostInputs = freshHostInputs();
    hostLastMs = Date.now();
    if (hostLoop) clearInterval(hostLoop);
    hostLoop = setInterval(hostTick, HOST_TICK_MS);
  }
  function stopHost() {
    if (hostLoop) clearInterval(hostLoop);
    hostLoop = null;
    hostState = null;
  }
  function hostTick() {
    if (!hostState) return;
    const now = Date.now();
    const dt = Math.min(0.1, (now - hostLastMs) / 1000);
    hostLastMs = now;
    // Compute occupancy every tick — p1 is always us; others follow
    // their DataChannel. We mask the snapshot below regardless of
    // game status so vacant seats never paint a ship on anyone's
    // screen (including during countdown).
    const occupied = {};
    for (const s of SEATS) occupied[s] = (s === 'p1') ? true : peerConnectedTo(s);

    if (hostState.status === 'countdown') {
      // engine.step is a no-op while non-running, so we just count
      // time. Ship positions are still being updated by incoming
      // `pos` messages via hostReceive — players can move freely
      // during the countdown.
      if (now >= hostState.countdownEndMs) hostState.status = 'running';
    } else {
      step(hostState, hostInputs, dt, occupied);
    }

    // `seats` mirrors the server-side wire field so clients can tell
    // "connected but dead/respawning" from "vacant seat" — `alive`
    // alone became ambiguous once respawns landed in Phase D.
    const snap = { type: 'state', t: now, ...snapshotForClient(hostState), seats: { ...occupied } };
    for (let i = 0; i < SEATS.length; i++) {
      if (!occupied[SEATS[i]]) snap.players[i].alive = false;
    }
    handle(snap);                 // P1's own render path
    broadcastOverDC(snap);        // → all connected peers
    if (hostState.status === 'gameover') {
      if (hostLoop) clearInterval(hostLoop);
      hostLoop = null;
    }
  }
  function hostReceive(seat, msg) {
    if (!hostState) return;
    if (msg.type === 'input') {
      hostInputs[seat] = { left: !!msg.left, right: !!msg.right, fire: !!msg.fire };
    } else if (msg.type === 'pos') {
      if (typeof msg.x !== 'number' || !Number.isFinite(msg.x)) return;
      const ship = hostState.ships[seat];
      if (!ship || !ship.alive) return;
      ship.x = Math.max(0, Math.min(PF_W - SHIP_W, msg.x));
    } else if (msg.type === 'name') {
      if (typeof msg.name !== 'string') return;
      hostState.names[seat] = msg.name.trim().slice(0, NAME_MAX_CHARS);
    } else if (msg.type === 'cheat') {
      // Debug B-key skip — applied to local hostState. Engine helper
      // gates by status/phase so we don't need to guard here.
      engine.cheatSkip && engine.cheatSkip(hostState);
    }
  }

  // WebRTC star topology: P1 is always the host, with one peer per
  // other player. Non-P1 clients each have a single peer to P1.
  //   - peers: Map<otherSeat, SimplePeer>
  //   - P1: 0..3 peers (one per joined non-P1)
  //   - non-P1: 0..1 peers (just the one to P1)
  // Signal routing is "signal from X → peers.get(X).signal(payload)"
  // — symmetric, so the same code handles either role.
  function peerConnectedTo(seat) {
    const p = peers.get(seat);
    return !!(p && p.connected);
  }
  function anyPeerConnected() {
    for (const p of peers.values()) if (p.connected) return true;
    return false;
  }
  function allOccupiedPeersConnected() {
    // Host (P1): every occupied non-P1 seat must have a connected peer.
    // Client (non-P1): we just need a connected peer to P1.
    // Uses seatOccupied() (authoritative `seats` field) rather than
    // .alive so a mid-respawn ship doesn't briefly read as "vacant"
    // and demote the transport badge to "connecting" or "relay".
    if (!mySeat || !lastState) return false;
    if (mySeat === 'p1') {
      let anyOther = false;
      for (let i = 1; i < SEATS.length; i++) {
        if (!seatOccupied(i)) continue;
        anyOther = true;
        if (!peerConnectedTo(SEATS[i])) return false;
      }
      return anyOther;
    }
    return peerConnectedTo('p1');
  }
  function p2pUp() { return anyPeerConnected(); }

  function broadcastOverDC(msg) {
    // Host pushes the same payload (e.g. a snapshot) to every open DC.
    if (mySeat !== 'p1') return;
    const json = JSON.stringify(msg);
    for (const p of peers.values()) {
      if (!p.connected) continue;
      try { p.send(json); } catch { /* peer dying, close handler cleans up */ }
    }
  }
  function sendToHost(msg) {
    // Non-P1 clients route gameplay messages to P1 via their single
    // peer. No-op on P1 (we don't call it from there).
    const p = peers.get('p1');
    if (!p || !p.connected) return;
    try { p.send(JSON.stringify(msg)); }
    catch (e) { console.warn('[P2P] send err:', e && e.message); }
  }

  // Transport router for client→server gameplay messages. Three modes:
  //   - host engaged + P1: we ARE the server, apply locally
  //   - host engaged + non-P1: send to P1 via DC
  //   - not engaged: relay via WS to DO (cloud mode)
  function sendToServer(msg) {
    if (hostEngaged) {
      if (mySeat === 'p1') hostReceive('p1', msg);
      else                 sendToHost(msg);
      return;
    }
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
  }

  // --------------------------------------------------------------------
  // WebRTC peer pool — star topology
  //
  // peers: Map<otherSeat, SimplePeer>. On P1 we hold one entry per
  // other joined player; on non-P1 we hold a single entry for P1.
  //
  // Signalling is symmetric: each side's `on('signal')` emits an SDP/ICE
  // payload tagged with the *other* seat as the target; the DO relays
  // it to that seat's socket; the receiver routes it to peers.get(from).
  // Signals arriving before the local peer exists are queued per seat.
  const peers = new Map();              // otherSeat → SimplePeer
  const pendingByPeer = new Map();      // otherSeat → array of queued signals

  const transportEl = document.getElementById('transport');
  function setTransport(state) {
    currentTransport = state;
    transportEl.classList.remove('p2p', 'connecting');
    if (state === 'p2p')             { transportEl.textContent = 'P2P';  transportEl.classList.add('p2p'); }
    else if (state === 'connecting') { transportEl.textContent = 'P2P…'; transportEl.classList.add('connecting'); }
    else if (state === 'solo')       { transportEl.textContent = 'SOLO'; transportEl.classList.add('p2p'); }
    else                              { transportEl.textContent = 'relay'; }
  }
  function refreshTransport() {
    // SOLO takes precedence over RELAY when we're host-engaged with no
    // peers — gameplay is running locally so labelling it "relay"
    // would be a lie (and would let a confusing 365 ms DO ping read
    // as a perf problem when it's irrelevant to actual input latency).
    if (allOccupiedPeersConnected()) setTransport('p2p');
    else if (peers.size > 0)         setTransport('connecting');
    else if (hostEngaged)            setTransport('solo');
    else                             setTransport('relay');
  }

  // STUN servers — without these SimplePeer only emits host candidates
  // (LAN IPs). Same Wi-Fi works (assuming the AP allows client-to-
  // client traffic), but hotels almost always disable that ("AP
  // isolation" / "guest mode"). STUN lets each peer discover its
  // public ip:port behind NAT so the other end has something to
  // connect to. Public Google + Cloudflare STUN are free and well-
  // maintained; we list multiple so a single outage doesn't break
  // WebRTC for everyone.
  //
  // STUN doesn't fix every NAT — symmetric NAT (some hotel + cellular
  // setups) still needs a TURN relay we don't run yet. The DO cloud-
  // relay fallback is the safety net for that case.
  const ICE_SERVERS = [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun.l.google.com:5349' },
    { urls: 'stun:stun.cloudflare.com:3478' },
  ];

  // Create a peer to `otherSeat` if one doesn't exist yet. Host (P1)
  // initiates; clients are passive (they wait for P1's offer). Idempotent.
  function makePeerTo(otherSeat) {
    if (typeof SimplePeer === 'undefined') return; // library not loaded
    if (peers.has(otherSeat)) return;
    const initiator = (mySeat === 'p1');
    let p;
    try {
      p = new SimplePeer({
        initiator,
        trickle: true,
        config: { iceServers: ICE_SERVERS },
      });
    } catch (e) {
      console.warn('[P2P] new SimplePeer failed for', otherSeat, e && e.message);
      return;
    }
    peers.set(otherSeat, p);
    console.log('[P2P] peer to', otherSeat, '(initiator=' + initiator + ')');
    // ICE diagnostic logging — taps into the underlying
    // RTCPeerConnection so failures past the SimplePeer wrapper are
    // visible (e.g. "all candidates failed" with no error event).
    // Useful when triaging hotel / cellular / corporate networks
    // where STUN alone isn't enough and we need to know if it's a
    // candidate-gathering failure vs a connectivity check failure.
    if (p._pc) {
      p._pc.addEventListener('iceconnectionstatechange', () => {
        console.log('[P2P] ICE', otherSeat, '→', p._pc.iceConnectionState);
      });
      p._pc.addEventListener('icegatheringstatechange', () => {
        console.log('[P2P] gather', otherSeat, '→', p._pc.iceGatheringState);
      });
    }

    p.on('signal', (data) => {
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ type: 'signal', to: otherSeat, payload: data }));
      }
    });
    p.on('connect', () => {
      console.log('[P2P] DataChannel open ↔', otherSeat);
      refreshTransport();
      // Non-host: the host doesn't see WS state messages once host
      // mode is engaged (we drop them client-side), so any name we
      // sent over WS pre-engagement won't reach them. Re-send via
      // DC now that we have a direct channel.
      if (mySeat !== 'p1' && otherSeat === 'p1' && myName) {
        try { p.send(JSON.stringify({ type: 'name', name: myName })); } catch {}
      }
    });
    p.on('data', (raw) => onPeerData(otherSeat, raw));
    p.on('error', (err) => {
      console.warn('[P2P] error on', otherSeat, ':', err && err.message);
      cleanupPeer(otherSeat);
    });
    p.on('close', () => {
      console.log('[P2P] closed ↔', otherSeat);
      cleanupPeer(otherSeat);
    });

    // Drain any signals queued before this peer existed.
    const queued = pendingByPeer.get(otherSeat);
    if (queued) {
      for (const sig of queued) {
        try { p.signal(sig); } catch (e) { console.warn('[P2P] queued signal:', e); }
      }
      pendingByPeer.delete(otherSeat);
    }
    refreshTransport();
  }

  function onPeerData(otherSeat, raw) {
    let dmsg;
    try { dmsg = JSON.parse(raw.toString()); } catch { return; }
    // Ping/pong is symmetric — either side echoes, either side measures.
    if (dmsg.type === 'ping') {
      const p = peers.get(otherSeat);
      if (p && p.connected) {
        try { p.send(JSON.stringify({ type: 'pong', t: dmsg.t })); } catch {}
      }
      return;
    }
    if (dmsg.type === 'pong') { applyPong(dmsg.t); return; }
    if (mySeat === 'p1') {
      // Host: a client's `start` engages host mode for us; all other
      // gameplay messages route into the local hostState.
      if (dmsg.type === 'start') {
        if (!hostEngaged) { hostEngaged = true; startHost(); }
        return;
      }
      // Name updates land in hostState whenever it exists, even
      // before host mode engages — that way names persist across the
      // first Start press instead of being lost.
      if (dmsg.type === 'name' && hostState) {
        hostReceive(otherSeat, dmsg);
        return;
      }
      if (hostEngaged) hostReceive(otherSeat, dmsg);
    } else {
      // Thin client: snapshots from the host. First DC snapshot
      // engages host mode locally so subsequent inputs go via DC.
      if (!hostEngaged && dmsg.type === 'state') hostEngaged = true;
      handle(dmsg);
    }
  }

  // Idempotent — call from state handler / on demand. Host (P1)
  // creates one peer per other occupied seat; clients create exactly
  // one peer to P1 once P1 shows alive in the snapshot.
  // Prefer the wire `seats` map (authoritative connected-or-not, set
  // by the transport layer) over `players[i].alive` (which now flips
  // false during mid-respawn windows too). Falls back to `alive` for
  // pre-Phase-D snapshots that lack the field.
  function seatOccupied(i) {
    if (!lastState) return false;
    if (lastState.seats) return !!lastState.seats[SEATS[i]];
    return !!lastState.players[i]?.alive;
  }
  function maybeCreatePeers() {
    if (typeof SimplePeer === 'undefined') return;
    if (!mySeat || !lastState) return;
    if (mySeat === 'p1') {
      for (let i = 1; i < SEATS.length; i++) {
        const other = SEATS[i];
        if (peers.has(other)) continue;
        if (seatOccupied(i)) makePeerTo(other);
      }
    } else {
      if (peers.has('p1')) return;
      if (seatOccupied(0)) makePeerTo('p1');
    }
  }

  function onIncomingSignal(from, payload) {
    // The other end of a peer is the seat the signal came from. If
    // we don't have a peer to them yet (we created ours slightly
    // later than they did), queue the signal until makePeerTo
    // installs one.
    const p = peers.get(from);
    if (p) {
      try { p.signal(payload); } catch (e) { console.warn('[P2P] signal err:', e); }
      return;
    }
    if (!pendingByPeer.has(from)) pendingByPeer.set(from, []);
    pendingByPeer.get(from).push(payload);
  }

  // Tear down a single peer (its DC closed or errored). Host: the
  // departed player's seat goes vacant and the loop keeps running
  // with their inputs cleared. Non-host: lost connection to host —
  // disengage host mode so future input/pos falls back to WS.
  function cleanupPeer(otherSeat) {
    const p = peers.get(otherSeat);
    if (p) { try { p.destroy(); } catch {} }
    peers.delete(otherSeat);
    pendingByPeer.delete(otherSeat);
    if (mySeat === 'p1') {
      // Clear the gone player's latched inputs so a held FIRE doesn't
      // keep auto-firing in the empty seat.
      if (hostInputs[otherSeat]) hostInputs[otherSeat] = zeroInput();
    } else if (otherSeat === 'p1' && hostEngaged) {
      hostEngaged = false;
    }
    refreshTransport();
  }

  // Tear down every peer (manual retry button etc.). Same shape as a
  // cascade of cleanupPeer calls.
  function resetPeers() {
    for (const seat of Array.from(peers.keys())) cleanupPeer(seat);
  }

  function connect() {
    ws = new WebSocket(wsUrl);
    ws.addEventListener('open',  () => {
      setStatus('Connected. Waiting for room…');
      startPings();
      startPosPublish();
    });
    ws.addEventListener('error', () => setStatus('Connection error'));
    ws.addEventListener('close', () => {
      setStatus('Disconnected');
      startBtn.disabled = true;
      stopPings();
      stopPosPublish();
    });
    ws.addEventListener('message', (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }
      // Belt-and-braces for the mid-game-engage edge case: if a
      // cloud-relay game was already running on the DO when host
      // mode engaged, the DO keeps ticking with stale inputs (we
      // stopped sending them) and emits stale snapshots. Drop those
      // here — the authoritative state now flows over the
      // DataChannel. In the common path (P2P up *before* first
      // Start) the DO never enters its running state at all, so this
      // guard is a no-op.
      if (hostEngaged && msg && msg.type === 'state') {
        // Solo-host: ignore the DO's gameplay state for rendering (our
        // local hostState is authoritative) but still propagate seat
        // occupancy so refreshLobby + maybeCreatePeers fire when a
        // friend joins via the DO. Without this, the WebRTC handshake
        // never starts and the joiner sits in 'waiting' forever.
        lastState = msg;
        refreshLobby();
        maybeCreatePeers();
        return;
      }
      handle(msg);
    });
  }

  function handle(msg) {
    if (msg.type === 'welcome') {
      mySeat = msg.seat;
      // The local seat is indicated by the YOU badge on the player slot
      // (refreshPlayerSlots renders it), so we no longer need a "You are
      // P1" text node above the controls.
      // Tell the server our display name as soon as we have a seat
      // so the very first snapshot it broadcasts already includes it.
      if (myName) publishName();
      const serverV = msg.netcode;
      // Colo trace: edge that handled the upgrade → data center the
      // DO actually lives in. Tells us whether locationHint took and
      // where the round-trip really goes.
      const colos = (msg.workerColo && msg.doColo)
        ? ' · ' + msg.workerColo + '→' + msg.doColo
        : '';
      if (serverV != null && serverV !== NETCODE_VERSION) {
        netcodeEl.textContent =
          'netcode client v' + NETCODE_VERSION + ' ⚠ server v' + serverV + colos;
        netcodeEl.classList.add('mismatch');
      } else if (serverV != null) {
        netcodeEl.textContent = 'netcode v' + NETCODE_VERSION + colos;
        netcodeEl.classList.remove('mismatch');
      }
      return;
    }
    if (msg.type === 'pong') {
      if (typeof msg.t === 'number') applyPong(msg.t);
      return;
    }
    if (msg.type === 'room_full') {
      setStatus('Room is full — try again later');
      startBtn.disabled = true;
      return;
    }
    if (msg.type === 'state') {
      // Diff the new snapshot against the previous one to fire SFX on
      // transitions: score jumping = invader kill, my seat going
      // dead-this-tick = ship explosion, status flipping to gameover
      // = end-of-run jingle (only the losing variant — wins stay
      // silent because the "you won" overlay carries the moment).
      // prevState is captured BEFORE overwriting lastState below.
      const prev = lastState;
      const seatIdx = mySeat ? SEATS.indexOf(mySeat) : -1;
      if (prev) {
        // "Any kill happened this tick" = sum of all per-player
        // scores increased. Derived locally now that the team-score
        // wire field is gone (per-player only — Sackboy model).
        let prevSum = 0, nextSum = 0;
        for (let i = 0; i < prev.players.length; i++) prevSum += (prev.players[i]?.score | 0);
        for (let i = 0; i < msg.players.length;  i++) nextSum += (msg.players[i]?.score  | 0);
        if (nextSum > prevSum) Arcade.Audio.play('sfx-kill', 0.5);
        if (seatIdx >= 0
            && prev.players[seatIdx]?.alive
            && !msg.players[seatIdx]?.alive
            && prev.status === 'running') {
          // Gate on prev.status, not msg.status — the engine can flip
          // status to 'gameover' on the same tick the last ship dies
          // (resolveCollisions then checkEnd in step()), so checking
          // msg.status would swallow the explosion on round-ending
          // deaths. The lose jingle still fires separately below.
          Arcade.Audio.play('sfx-explosion', 0.6);
          // CRT shake — own-ship death is the right drama beat to
          // jolt the cabinet. Other players' deaths don't shake
          // this client (their cabinet shakes on its own snapshot).
          shakeTube();
        }
        // CRT shake on boss defeat too. Detect transition: prev had
        // a boss alive, msg has no boss (cleared in checkStageClear
        // when hp hits 0). Guard on prev.boss truthiness so a
        // mid-deploy snapshot without `boss` doesn't false-fire.
        if (prev.boss && prev.boss.hp > 0 && (!msg.boss || msg.boss.hp === 0)
            && prev.phase === 'boss') {
          shakeTube();
        }
        if (msg.status === 'gameover' && prev.status !== 'gameover' && !msg.won) {
          Arcade.Audio.play('sfx-lose', 0.6);
        }
        if (typeof msg.lives === 'number' && typeof prev.lives === 'number'
            && msg.lives < prev.lives) {
          // Shared-pool tick: brief flash + "-1" popup near the LIVES
          // HUD so the whole team can see "we just lost one" instead
          // of having to spot a quiet number change while shooting.
          livesFlashUntil = performance.now() + LIVES_FLASH_MS;
        }
        // March heartbeat — fires on each authoritative shuffle-frame
        // flip, so the iconic 4-note loop speeds up exactly when the
        // swarm does (engine's iFrame advances by horizontal distance
        // travelled). Only during grid phase + actually running.
        if (msg.status === 'running' && msg.phase === 'grid'
            && typeof msg.iFrame === 'number' && msg.iFrame !== prev.iFrame) {
          synth.march();
        }
        // Restart of a new run — reset the march sequence so it
        // always opens on the E2 (the canonical first beat).
        if (msg.status === 'running' && prev.status !== 'running') {
          synth.marchReset();
        }
      }
      lastState = msg;
      snapBuffer.push(msg);
      latestServerT     = msg.t;
      latestLocalRecvMs = performance.now();
      // Trim anything older than BUFFER_KEEP_MS, but always keep at
      // least two snapshots so we have a pair to lerp between.
      while (snapBuffer.length > 2 && (msg.t - snapBuffer[0].t) > BUFFER_KEEP_MS) {
        snapBuffer.shift();
      }
      reconcileLocalShip(msg);
      refreshLobby();
      maybeCreatePeers();
      return;
    }
    if (msg.type === 'signal') {
      const from = msg.from;
      if (from && SEATS.includes(from)) onIncomingSignal(from, msg.payload);
      return;
    }
  }

  // Cached once — the tube class toggle drives both canvas reveal
  // (cabinet.css `.tube.is-ready canvas { visibility: visible }`) and
  // prescreen fade (our `.tube.is-ready #prescreen` rule). Single
  // class flip = entire UI transition.
  const tube = document.querySelector('.tube');

  // CRT shake — toggles the shared `.tube.is-shaking` keyframe in
  // cabinet.css. Triggered on dramatic moments only (boss defeat,
  // own-ship death) so it stays a treat, not a distraction.
  // Re-entrant: a second trigger before the first ends restarts the
  // animation cleanly. SHAKE_MS matches the keyframe duration in
  // cabinet.css (.tube.is-shaking → 0.55 s) so the class lifetime
  // and the animation track exactly; out-of-sync values would let
  // the next trigger fire mid-animation or strip the class early.
  const SHAKE_MS = 550;
  let shakeUntil = 0;
  function shakeTube() {
    if (!tube) return;
    // Force a reflow if already shaking so the keyframe restarts
    // from frame 0 rather than continuing wherever it was.
    if (tube.classList.contains('is-shaking')) {
      tube.classList.remove('is-shaking');
      // Read offsetWidth to flush the layout change before re-adding.
      void tube.offsetWidth;
    }
    tube.classList.add('is-shaking');
    shakeUntil = performance.now() + SHAKE_MS;
    setTimeout(() => {
      if (performance.now() >= shakeUntil) tube.classList.remove('is-shaking');
    }, SHAKE_MS + 50);
  }

  // Player slot elements, indexed by seat position. Filled from
  // refreshPlayerSlots on every snapshot.
  const playerSlotEls = SEATS.map(s =>
    document.querySelector(`.player-slot[data-seat="${s}"]`));

  function refreshPlayerSlots() {
    if (!lastState) return;
    for (let i = 0; i < MAX_SEATS; i++) {
      const slot = playerSlotEls[i];
      if (!slot) continue;
      const p = lastState.players[i];
      // Prefer the authoritative `seats` map (added in Phase D) over
      // `players[i].alive` — once respawns landed, alive can be false
      // for a connected seat that's mid-respawn or just died at end
      // of a round. Falls back to alive for pre-Phase-D snapshots.
      const occupied = seatOccupied(i);
      slot.classList.toggle('is-active', occupied);
      slot.classList.toggle('is-empty', !occupied);
      const nameEl = slot.querySelector('.ps-name');
      if (occupied) {
        const trimmed = (p.name || '').trim();
        nameEl.textContent = trimmed || 'PLAYER';
      } else {
        nameEl.textContent = 'waiting…';
      }
      // YOU badge on the local seat (created lazily; idempotent).
      const isYou = SEATS[i] === mySeat && occupied;
      let youEl = slot.querySelector('.ps-you');
      if (isYou && !youEl) {
        youEl = document.createElement('div');
        youEl.className = 'ps-you';
        youEl.textContent = 'YOU';
        slot.appendChild(youEl);
      } else if (!isYou && youEl) {
        youEl.remove();
      }
    }
  }

  // Tracks the prior status across refreshLobby calls so we can
  // detect a *transition* into gameover (vs. a snapshot from a room
  // we just joined that was already over). Without this, a fresh
  // visitor landing on /invaders-mp/<existing-room-code> would see
  // someone else's stale endscreen they can't dismiss.
  let prevLobbyStatus = null;

  function refreshLobby() {
    if (!lastState) return;
    const s = lastState.status;
    const enteredGameover = s === 'gameover' && prevLobbyStatus === 'running';
    prevLobbyStatus = s;
    // Hide the endscreen overlay when status leaves 'gameover' so a
    // fresh round starts on the normal lobby.
    if (s !== 'gameover') hideEndscreen();
    // Use the authoritative `seats` map (added in Phase D) — true
    // occupancy regardless of alive/respawn state. Pre-Phase-D
    // snapshots fall back to the alive proxy via seatOccupied().
    let occupied = 0;
    for (let i = 0; i < MAX_SEATS; i++) if (seatOccupied(i)) occupied++;
    // Reveal the cabinet (canvas visible + prescreen faded) once the
    // countdown begins, so the 3-2-1 → ATTACK overlay paints on a
    // visible canvas. Goes back to the prescreen on waiting/ready (no
    // game yet) and gameover (so the player can hit Start to replay).
    tube.classList.toggle('is-ready', s === 'countdown' || s === 'running');
    refreshPlayerSlots();
    if (s === 'waiting') {
      setStatus('Connecting…');
      startBtn.disabled = true;
    } else if (s === 'ready') {
      // Solo → invite-friends nudge; multi → READY!.
      setStatus(occupied >= 2
        ? `${occupied} players ready — tap START!`
        : 'Tap START — friends can join anytime');
      startBtn.disabled = false;
    } else if (s === 'countdown') {
      setStatus('GET READY!');
      startBtn.disabled = true;
    } else if (s === 'running') {
      // Prescreen is hidden during running so this text is invisible,
      // but keep it set in case we surface a HUD later.
      setStatus('');
      startBtn.disabled = true;
    } else if (s === 'gameover') {
      // Endscreen owns the gameover UI now (headline + score +
      // initials / PLAY AGAIN) — but ONLY for rounds the player
      // actually participated in (caught by `enteredGameover`).
      // A fresh visitor landing on a room that was already over
      // sees the normal lobby with START enabled, so they can
      // begin a new round instead of being trapped behind a stale
      // overlay with someone else's score.
      startBtn.disabled = false;
      if (enteredGameover) {
        setStatus('');
        showEndscreen();
      } else {
        setStatus('Tap START — friends can join anytime');
      }
    }
  }

  // ── Endscreen overlay ───────────────────────────────────────
  // Dedicated full-screen overlay shown on gameover. Hides the
  // lobby chrome (QR / players / name / START / status / debug)
  // and focuses on this player's own final + (if qualifying)
  // initials entry. Same model as Sackboy: per-device own-score
  // experience, no team-total visibility.
  const endscreen      = document.getElementById('endscreen');
  const esHeadline     = document.getElementById('es-headline');
  const esScore        = document.getElementById('es-score');
  const esLbMsg        = document.getElementById('es-lb-msg');
  const esLeaderboardEl = document.getElementById('es-leaderboard');
  const esLbList       = esLeaderboardEl.querySelector('.es-lb-list');
  const esDismissHint  = document.getElementById('es-dismiss-hint');
  const goInitialsEl   = document.getElementById('go-initials');
  let endscreenShown = false;
  let endscreenDismissAt = 0;         // performance.now() ms — 0 = no timer
  const ENDSCREEN_LINGER_NO_INITIALS_MS = 6000;
  const ENDSCREEN_LINGER_AFTER_SUBMIT_MS = 2500;

  function scheduleEndscreenDismiss(ms) {
    endscreenDismissAt = performance.now() + ms;
    esDismissHint.hidden = false;
  }
  // Render the top-10 leaderboard inside the endscreen. `highlightInitials`
  // (if provided) marks the row in green so the player can see where
  // they just landed after a successful submit.
  function paintLeaderboard(highlightInitials) {
    const list = Arcade.Leaderboard.read();
    if (!list.length) {
      esLeaderboardEl.hidden = true;
      return;
    }
    esLbList.innerHTML = '';
    list.forEach((entry, i) => {
      const li = document.createElement('li');
      if (highlightInitials && entry.initials === highlightInitials) {
        li.classList.add('is-mine');
      }
      const r   = document.createElement('span'); r.className = 'rank';     r.textContent = `${i + 1}.`;
      const ini = document.createElement('span'); ini.className = 'initials'; ini.textContent = entry.initials;
      const sc  = document.createElement('span'); sc.className = 'score';    sc.textContent = String(entry.score);
      li.appendChild(r); li.appendChild(ini); li.appendChild(sc);
      esLbList.appendChild(li);
    });
    esLeaderboardEl.hidden = false;
  }
  function showEndscreen() {
    if (endscreenShown) return;
    endscreenShown = true;
    const myIdx = mySeat ? SEATS.indexOf(mySeat) : -1;
    const myFinal = (myIdx >= 0 && lastState.players[myIdx])
      ? (lastState.players[myIdx].score | 0)
      : 0;
    esHeadline.textContent = lastState.won ? 'EARTH IS SAFE' : 'GAME OVER';
    esHeadline.classList.toggle('is-loss', !lastState.won);
    esScore.textContent = String(myFinal);
    const shouldPromptInitials =
      !lastState.cheated &&
      myFinal > 0 &&
      Arcade.Leaderboard.qualifies(myFinal);
    goInitialsEl.hidden = !shouldPromptInitials;
    esDismissHint.hidden = true;
    paintLeaderboard();
    // Single-line status that explains the leaderboard state — the
    // big missing piece in the earlier flow ("got 2000 points, why
    // no prompt?"). Different message per path, hidden during
    // initials entry (the initials block carries the message there).
    esLbMsg.classList.remove('is-warn');
    if (shouldPromptInitials) {
      esLbMsg.hidden = true;
    } else if (lastState.cheated) {
      esLbMsg.textContent = 'TEST RUN — SCORE NOT SAVED';
      esLbMsg.classList.add('is-warn');
      esLbMsg.hidden = false;
    } else {
      // Real run that didn't qualify — show the cutoff so the player
      // knows what to beat. If localStorage hasn't synced yet (rare)
      // fall back to a generic "didn't make it" line.
      const lbList = Arcade.Leaderboard.read();
      const cutoff = (lbList.length >= 10) ? lbList[lbList.length - 1].score : 0;
      esLbMsg.textContent = cutoff > 0
        ? `BEAT ${cutoff} TO MAKE THE LEADERBOARD`
        : 'NOT ON THE LEADERBOARD';
      esLbMsg.classList.add('is-warn');
      esLbMsg.hidden = false;
    }
    endscreen.hidden = false;
    if (shouldPromptInitials) {
      // Drop focus from the name input so window keydown events
      // (arrows, letters, enter) reach the initials handler cleanly.
      if (document.activeElement && document.activeElement.blur) {
        document.activeElement.blur();
      }
      Arcade.Initials.open();
      // No auto-dismiss while typing initials — wait for submit.
    } else {
      // Nothing to enter; show the score for a beat then auto-return
      // to the title screen so the player isn't stuck behind a
      // dead-end overlay.
      scheduleEndscreenDismiss(ENDSCREEN_LINGER_NO_INITIALS_MS);
    }
  }
  function hideEndscreen() {
    endscreen.hidden = true;
    endscreenShown = false;
    endscreenDismissAt = 0;
    esDismissHint.hidden = true;
    if (Arcade.Initials.isActive()) Arcade.Initials.close();
  }
  // Tap anywhere on the overlay to skip the auto-dismiss timer.
  // Only active when the timer is set — during initials entry the
  // taps should reach the slot rows / drag handlers in initials.js.
  endscreen.addEventListener('click', () => {
    if (endscreenDismissAt > 0) hideEndscreen();
  });
  // RAF-driven dismiss check. Cheap (one comparison per frame) and
  // avoids cross-cutting setTimeout state to manage on re-shows.
  function tickEndscreenDismiss() {
    if (endscreenDismissAt > 0 && performance.now() >= endscreenDismissAt) {
      hideEndscreen();
    }
    requestAnimationFrame(tickEndscreenDismiss);
  }
  requestAnimationFrame(tickEndscreenDismiss);

  // Wire the shared initials state machine. onSubmit posts to the
  // leaderboard and closes the entry UI; the player can then tap
  // START to play again. The fire button gets re-labelled SELECT
  // while initials are active so the touch flow is obvious.
  Arcade.Initials.mount({
    fireButton: '#tc-fire',
    fireLabel:  { idle: 'FIRE', select: 'SELECT' },
    // We use a static .go-initials-label inside #go-initials for the
    // "ENTER INITIALS" instruction — it should stay visible the whole
    // time. Disabling the framework's prompt selector keeps it from
    // hiding anything we don't want hidden.
    promptSelector: null,
    onSubmit: (initials) => {
      const myIdx = mySeat ? SEATS.indexOf(mySeat) : -1;
      const myFinal = (myIdx >= 0 && lastState && lastState.players[myIdx])
        ? (lastState.players[myIdx].score | 0)
        : 0;
      // Endscreen swap: initials block → "SAVED AS ABC" confirmation
      // + leaderboard re-paints with the new entry highlighted in
      // green. Auto-returns to the title screen after a brief linger
      // so the player sees their entry landed. Submit fires async;
      // if the POST fails the local mirror still has the entry from
      // the optimistic submit() call below.
      goInitialsEl.hidden = true;
      esLbMsg.textContent = `SCORE SAVED AS ${initials}`;
      esLbMsg.classList.remove('is-warn');
      esLbMsg.hidden = false;
      Arcade.Leaderboard.submit(myFinal, initials).then(res => {
        if (!res.ok) {
          console.warn('[leaderboard] submit failed:', res.error);
          return;
        }
        // Re-paint with the fresh server-confirmed list so the row
        // ordering / cutoff matches reality, then highlight ours.
        paintLeaderboard(initials);
      });
      // Optimistic local paint so the highlight shows even if the
      // POST hasn't returned by the time the linger expires.
      paintLeaderboard(initials);
      scheduleEndscreenDismiss(ENDSCREEN_LINGER_AFTER_SUBMIT_MS);
    },
  });

  startBtn.addEventListener('click', () => {
    // iOS needs the AudioContext created/resumed inside a real user
    // gesture. Start is the first guaranteed tap, so do it here for
    // both the shared Arcade.Audio (sfx-* samples) AND our local
    // WebAudio synth (march heartbeat + UFO warble). Each owns its
    // own AudioContext under the hood.
    Arcade.Audio.ensureCtx();
    synth.ensure();
    // Block restart while initials are open — otherwise tapping
    // START mid-submission loses the score without writing it to
    // the leaderboard. The player can either finish entering
    // initials (FIRE/SELECT advances + submits on the last slot)
    // or just sit tight and START becomes responsive again once
    // submission closes the initials UI.
    if (Arcade.Initials.isActive()) return;
    // p1 engages host mode on Start whenever the DO round trip is
    // skippable — either P2P peers are already connected (host serves
    // them via DC) OR no other seats are occupied (pure solo, runs
    // local-only with the DO connection idling for late joins). Solo
    // was the 95% case and was paying 100-365 ms per input by round-
    // tripping through the DO; this drops it to one frame.
    //
    // If a friend joins mid-solo session their first ~3 s of "waiting"
    // (the DO stays in 'waiting' since we never sent it 'start')
    // resolves when WebRTC handshake delivers our live state via DC.
    const otherSeatsOccupied = SEATS.some((_s, i) => i > 0 && seatOccupied(i));
    if (mySeat === 'p1' && (anyPeerConnected() || !otherSeatsOccupied)) {
      hostEngaged = true;
      startHost();
      // Badge follows hostEngaged for the SOLO case (peer events drive
      // the P2P/connecting transitions on their own).
      refreshTransport();
      return;
    }
    if (mySeat !== 'p1' && peerConnectedTo('p1')) {
      hostEngaged = true;
      sendToHost({ type: 'start' });
      return;
    }
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'start' }));
  });
  document.getElementById('retryBtn').addEventListener('click', () => {
    console.log('[P2P] manual retry');
    resetPeers();
    setTransport('relay');
    maybeCreatePeers();
  });

  // --------------------------------------------------------------------
  // Input — send on change only
  const input = { left: false, right: false, fire: false };
  let lastSig = '';

  function setInput(field, value) {
    if (input[field] === value) return;
    input[field] = value;
    const sig = input.left + '|' + input.right + '|' + input.fire;
    if (sig === lastSig) return;
    lastSig = sig;
    sendToServer({ type: 'input', ...input });
  }

  // Keyboard
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') setInput('left',  true);
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') setInput('right', true);
    else if (e.key === ' ' || e.key === 'Spacebar') { setInput('fire', true); e.preventDefault(); }
    else if (e.key === 'b' || e.key === 'B') {
      // Debug skip — mirrors SP's B-key cheat. One press = one threat
      // skipped (kill grid → boss spawn, or kill boss → next set /
      // cutscene). Server gates by status/phase so spamming B during
      // the lobby or cutscene is a no-op. Skipped when focus is in a
      // text field (e.g. the name input) so typing a 'b' in your name
      // doesn't blast the swarm. Also skipped while typing initials
      // so the 'B' letter selection doesn't trigger a cheat call.
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      if (Arcade.Initials.isActive()) return;
      sendToServer({ type: 'cheat' });
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') setInput('left',  false);
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') setInput('right', false);
    else if (e.key === ' ' || e.key === 'Spacebar') setInput('fire', false);
  });

  // Touch — hold to engage. Track per-button so simultaneous left+fire
  // works. `is-pressed` matches the shared touch.css convention (the
  // :active pseudo-class alone doesn't cover the "held while finger
  // slides off" case).
  //
  // When Arcade.Initials is active (gameover + qualified for the
  // leaderboard), the touch buttons route to the initials state
  // machine instead: left/right cycle letters, fire/SELECT advances
  // the slot (and submits on the last one). Matches SP's flow.
  function bindTouch(elId, field, initialsAction) {
    const el = document.getElementById(elId);
    const down = (e) => {
      e.preventDefault();
      el.classList.add('is-pressed');
      if (Arcade.Initials.isActive()) {
        if (initialsAction) Arcade.Initials.action(initialsAction);
        return;
      }
      setInput(field, true);
    };
    const up = (e) => {
      e.preventDefault();
      el.classList.remove('is-pressed');
      // Always clear the input on release, even if initials are
      // active — otherwise a 'fire' held when the game ended would
      // stick into the next round.
      setInput(field, false);
    };
    el.addEventListener('touchstart',  down, { passive: false });
    el.addEventListener('touchend',    up,   { passive: false });
    el.addEventListener('touchcancel', up,   { passive: false });
  }
  bindTouch('tc-left',  'left',  'letter-prev');
  bindTouch('tc-right', 'right', 'letter-next');
  bindTouch('tc-fire',  'fire',  'advance');

  // --------------------------------------------------------------------
  // Render — playfield is engine units (PF_W × PF_H). CSS scales the
  // canvas via integer-pixel fitCanvas; image-rendering keeps the
  // pixels crisp. The render function draws the interpolated snapshot
  // pair (other ship + invaders + bullets) plus locally-predicted own
  // ship + ghost bullets layered on top.
  const canvas = document.getElementById('cv');
  const ctx = canvas.getContext('2d');
  function fitCanvas() {
    // Match SP's rendering pipeline: canvas bitmap is sized to the
    // CSS display size × devicePixelRatio, so each canvas pixel = one
    // device pixel. ctx.setTransform then maps PF coords to canvas
    // pixels at a floating-point scale. This avoids the "fixed PF
    // bitmap, then CSS-upscale-with-nearest-neighbour" approach,
    // which warped 8-px source sprites into asymmetric 1/2-PF-wide
    // columns when scaled to 12 PF visible. At display resolution
    // any fillRect anti-aliasing is sub-pixel and invisible.
    const tube = canvas.parentElement;          // .tube
    const sw = tube.clientWidth  - 16;
    const sh = tube.clientHeight - 16;
    const scale = Math.max(1, Math.min(sw / PF_W, sh / PF_H));
    const cssW = Math.round(PF_W * scale);
    const cssH = Math.round(PF_H * scale);
    const dpr  = window.devicePixelRatio || 1;
    canvas.style.width  = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width  = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    // setTransform replaces the matrix (cheap on resize), maps the
    // 260×280 PF playfield onto the full canvas pixel grid. Use
