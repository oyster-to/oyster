<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Groovebox</title><link rel="stylesheet" href="ui/app.css"></head>
<body>
  <div class="cabinet">
    <div class="cabinet-inner">
      <div class="cabinet-corners">
        <span class="screw tl"></span>
        <span class="screw tr"></span>
        <span class="screw bl"></span>
        <span class="screw br"></span>
      </div>
      <h1>groovebox</h1>
      <div class="transport">
        <button id="play">▶ play</button>
        <div class="transport-tempo">
          <span>Tempo</span>
          <input type="range" id="bpm" min="80" max="160" value="120">
          <span id="bpmv" class="transport-bpm-val">120</span>
          <span class="transport-bpm-unit">BPM</span>
        </div>
        <div class="transport-song">
          <span>Song</span>
          <select id="songsel"><option value="kids">Kids</option><option value="rising-sun">House of the Rising Sun</option><option value="electric-feel">Electric Feel</option><option value="heartbeats">Heartbeats</option></select>
        </div>
        <div class="transport-theme">
          <span>Theme</span>
          <select id="themesel">
            <option value="dark" selected>Dark</option>
            <option value="light">Light</option>
            <option value="beige">Beige</option>
            <option value="playdate">Playdate</option>
            <option value="purple">Purple</option>
            <option value="gameboy">Game Boy</option>
            <option value="amber">Amber</option>
            <option value="r1">Rabbit</option>
          </select>
        </div>
      </div>
      <div class="vtabs"><button data-view="drums" class="on">🥁 Drums</button><button data-view="melody">🎺 Melody</button><button data-view="bass">🎸 Bass</button><button data-view="scope">📈 Scope</button></div>
      <div id="viz"></div>
      <div id="strips"></div>
      <div id="fills"></div>
      <div id="master"></div>
      <div id="arrange"></div>
    </div>
    <div class="crt-vignette"></div>
  </div>
  <script type="module" src="ui/app.js"></script>
</body></html>
