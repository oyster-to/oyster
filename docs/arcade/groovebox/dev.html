<title>groovebox engine — dev harness</title>
<script type="module">
  import { createEngine } from './engine/index.js';
  import { kids } from './songs/kids.js';
  const eng = createEngine(); eng.load(kids);
  document.body.innerHTML = '<button id=p>▶ play</button> <button id=s>⏹ stop</button>';

  s.onclick = () => eng.stop();
