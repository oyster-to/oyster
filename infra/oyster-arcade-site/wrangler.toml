name = "oyster-arcade-site"
main = "src/worker.ts"
compatibility_date = "2026-04-01"

# Static assets — Cloudflare serves files from this directory at the edge.
# The relative path is resolved from this wrangler.toml's location, so the
# build doesn't depend on the worktree being checked out at any particular
# absolute path.
#
# Files under docs/arcade/ are checked into git; no build step needed.
[assets]
directory = "../../docs/arcade"
binding = "ASSETS"
not_found_handling = "404-page"
# Route every request through the worker (assets would otherwise be served
# directly when the path matches a file, so groovebox.oyster.to/ was getting
# the arcade index.html before the host rewrite in worker.ts could run).
# The worker proxies to ASSETS, so arcade.oyster.to behavior is unchanged.
run_worker_first = true

# Custom Domain (NOT a plain Workers Route): Cloudflare provisions the DNS
# record AND the TLS cert automatically on first deploy. A plain route
# requires a pre-existing DNS record on the subdomain; we don't have one
# and don't want to add a placeholder.
[[routes]]
pattern = "arcade.oyster.to"
custom_domain = true

# groovebox.oyster.to — same worker; the host rewrite in worker.ts serves
# the /groovebox/ subtree at this domain's root.
[[routes]]
pattern = "groovebox.oyster.to"
custom_domain = true

# Observability: lets `wrangler tail` work for debugging.
[observability]
enabled = true

# ─── Share registry ───────────────────────────────────────────────────────────
# One-time provisioning (see migrations/0001_registry.sql):
#   npx wrangler d1 create gb-registry          → paste database_id below
#   npx wrangler d1 migrations apply gb-registry --remote
#   npx wrangler secret put EDIT_KEY_SECRET     → long random value (HMAC key)
[[d1_databases]]
binding = "DB"
database_name = "gb-registry"
database_id = "e7426a6d-91b2-497c-965a-4df469bb0727"
migrations_dir = "migrations"

# Write rate limit: 5 writes / 60s / IP. (Binding periods only support 10|60s,
# so the spec's ~20/hr intent is enforced as a per-minute burst cap.)
[[unsafe.bindings]]
name = "WRITE_LIMIT"
type = "ratelimit"
namespace_id = "4401"
simple = { limit = 5, period = 60 }
