name = "oyster-cloud"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
# nodejs_compat is required by @cloudflare/vitest-pool-workers (the test
# infrastructure needs Node-style APIs inside the Worker runtime). Production
# handlers don't depend on it — they use Web Crypto + standard Web APIs only.
compatibility_flags = ["nodejs_compat"]

# Shared D1 binding — same database_id as oyster-auth so we can read sessions/users
# and own the synced_memory tables inside the same DB. Single source of truth.
[[d1_databases]]
binding = "DB"
database_name = "oyster-auth"
database_id = "44086805-fbfa-4446-8626-126af7e2ec19"
migrations_dir = "../auth-worker/migrations"

# Session jsonl bytes (#322 Pick-up-here). Each object is a per-user
# AES-GCM-encrypted Claude Code transcript. Bucket creation:
#   wrangler r2 bucket create oyster-session-bytes
[[r2_buckets]]
binding = "SESSIONS_BUCKET"
bucket_name = "oyster-session-bytes"

[[routes]]
pattern = "cloud.oyster.to/api/*"
zone_name = "oyster.to"

# Legacy /app* URLs — kept indefinitely, serve only 308s to app.oyster.to.
[[routes]]
pattern = "oyster.to/app*"
zone_name = "oyster.to"

[[routes]]
pattern = "www.oyster.to/app*"
zone_name = "oyster.to"

# app.oyster.to — the remote view's own hostname (spec
# 2026-06-05-app-oyster-to-migration). custom_domain auto-provisions
# DNS + cert on deploy; the worker owns the entire hostname.
[[routes]]
pattern = "app.oyster.to"
custom_domain = true

# Forward /api/publish/* + /api/spaces/* on app.oyster.to to
# oyster-publish without a public hop. Cookie and Origin pass through.
[[services]]
binding = "PUBLISH"
service = "oyster-publish"

# Device relay rendezvous (spec 2026-06-07-device-relay-design). One DO
# per user; devices hold hibernatable WebSockets, the browser's relayed
# requests are framed onto them. First Durable Object in this worker.
[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayDO"

# KV-backed (new_classes, not new_sqlite_classes): the DO's persisted
# state is a handful of `disabled:<device_id>` flags + socket attachments,
# and @cloudflare/vitest-pool-workers' isolated storage can't stack
# SQLite-backed DO files (.sqlite-shm assertion). Revisit if the DO ever
# needs real queries.
[[migrations]]
tag = "v1"
new_classes = ["RelayDO"]

# Cloud remote view SPA (web/ built with VITE_OYSTER_MODE=cloud, base /).
# Run `npm run build:cloud` at the repo root before deploying.
[assets]
directory = "../../web/dist-cloud"
binding = "ASSETS"
# The worker gates the hostname root; unknown paths are SPA routes.
not_found_handling = "single-page-application"
run_worker_first = true
